# Publishes the container images this repository's defaults point at, and the
# harness image's copilot variant (Task 20450).
#
# Both were referenced long before they existed. `deploy/helm/cloop-hub`
# defaults image.repository to ghcr.io/blechschmidt/cloop, and
# pkg/executor/container.DefaultImage (with its Kubernetes twin) defaults to
# ghcr.io/blechschmidt/cloop-harness:latest — so an operator following the
# documentation got ImagePullBackOff from Helm and "image is not present
# locally" from `cloop executor preflight`, in both cases for a reference that
# could never resolve. This workflow is what makes those defaults true.
#
# Nothing here needs a secret: GITHUB_TOKEN can push to ghcr.io under the
# repository owner's namespace given `packages: write`, and the package it
# creates is linked back to this repository automatically.
#
# Every digest it pushes is signed, keyless (Task 20453): the multi-arch index
# and each platform manifest, by this workflow's own identity, which Fulcio
# names as .../.github/workflows/publish-images.yml@<ref>. A hub verifies
# cloop's own images against exactly that identity — pkg/provenance's
# ImagesIdentityRegexp, which accepts main and release tags and nothing else —
# before a sandbox runs one, so whoever can push to these packages without
# being this workflow can no longer decide what runs beside a lease's
# credentials. pkg/provenance's workflow_drift_test.go holds this file's
# triggers, its pin and its cosign version to the Go side.

name: Publish images

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_latest:
        # A bootstrap escape hatch, and only that.
        #
        # `latest` is what pkg/executor/container.DefaultImage points at, so it
        # has to exist before that default can work — but the release it should
        # describe (v0.0.1) was cut before this workflow existed, and a
        # workflow_dispatch against a tag can only run a workflow present in
        # that tag's tree. So the very first `latest` cannot come from a tag,
        # and is published from main, once, deliberately, by a human.
        #
        # Every subsequent `latest` moves on a release tag via the rule below.
        description: 'Also tag this build :latest (one-time backfill; normally latest moves only on a release tag)'
        type: boolean
        default: false

# Least privilege: read the tree, write packages, and request the OIDC token
# keyless signing proves this workflow's identity with. Notably NOT contents:
# write — publishing an image must not be able to move a tag or edit a release.
permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  # Serialise per ref so two pushes cannot race to move the same tag, but let
  # different refs publish in parallel.
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: ${{ matrix.image }} (${{ matrix.target }})
    # Only the refs the signing pin accepts: main and release tags. A
    # workflow_dispatch from any other branch would push images signed under
    # an identity every hub refuses as wrongly signed, so it never starts.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # The harness builds arm64 under emulation because the claude CLI's native
    # helpers have to be selected for the target architecture, not the builder's
    # (see the harness stage in the Dockerfile). That is slow, and slow is the
    # reason for a generous ceiling rather than the default 360.
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        include:
          # The hub. Pure-Go and cross-compiled from the builder's arch via
          # BUILDPLATFORM, so both platforms are cheap.
          - image: cloop
            target: runtime
            platforms: linux/amd64,linux/arm64
          # The sandbox workload image. Its arm64 leg runs npm under QEMU.
          - image: cloop-harness
            target: harness
            platforms: linux/amd64,linux/arm64
          # The same with the GitHub Copilot CLI, for copilot projects (Task
          # 20450). A variant rather than the default because the CLI adds
          # 445 MB unpacked, 217 MB compressed, to every pull (the Dockerfile's
          # harness stage says how it was measured). Its :latest is published
          # from main the first time this runs, by the bootstrap below, and
          # moves on release tags from then on.
          - image: cloop-harness-copilot
            target: harness-copilot
            platforms: linux/amd64,linux/arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Required for the harness's arm64 leg: without binfmt registered, the
      # emulated npm install cannot execute and the build fails on the first
      # RUN of the foreign-arch stage.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Does :latest exist yet?
        id: latest
        # The bootstrap, made self-limiting.
        #
        # :latest is what pkg/executor/container.DefaultImage resolves to, so it
        # has to exist before that default can work — but the release it ought
        # to describe (v0.0.1) was cut before this workflow existed, and a
        # workflow_dispatch against a tag can only run a workflow present in
        # that tag's tree. So the first :latest cannot come from a tag.
        #
        # Rather than let main move :latest forever, this asks the registry
        # whether the tag is there at all. Absent, it is published once; present,
        # this is a no-op and the rule below is the only thing that moves it.
        # The condition therefore stops being true the moment it has been used.
        run: |
          set -uo pipefail
          ref="ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest"
          if docker buildx imagetools inspect "$ref" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$ref already exists; :latest will move only on a release tag"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$ref does not exist yet; publishing it from this build"
          fi

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          # `latest` moves only on a release tag. The Go defaults point at
          # :latest, so this is the difference between "the default is the
          # newest release" and "the default is whatever last landed on main".
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # Compared against the string 'true' rather than used as a boolean:
            # on a push event `inputs` is null, and `false || null` renders as
            # the empty string, which metadata-action rejects with "Invalid
            # value for enable attribute". An explicit comparison is total over
            # both event shapes.
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish_latest == 'true' || steps.latest.outputs.exists == 'false' }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Resolve the version to stamp into the binary
        # Mirrors the release workflow: a tag stamps its own name, anything else
        # is a development build. `cloop upgrade --check` treats the literal
        # "dev" as "never upgrade", so an edge image must not claim a version.
        id: version
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "value=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            REVISION=${{ github.sha }}
            CREATED=${{ github.event.repository.updated_at }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

      - name: Install cosign
        # The version the hub image bundles (the Dockerfile's COSIGN_VERSION;
        # workflow_drift_test.go holds the two equal), so what signs here is
        # what verifies on a hub built from the same tree. The installer is
        # pinned by commit — it is what puts the signing tool on this runner —
        # and has no floating v4 tag to follow anyway.
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.4'

      - name: Sign the index and every platform manifest
        # Keyless: the OIDC token proves this workflow's identity to Fulcio,
        # which certifies it, and the signature is recorded in Rekor and stored
        # beside the image. Every digest a hub could resolve the tags to is
        # signed — the index a tag names, and each platform's manifest, which a
        # podman store or a pull by platform records instead. The attestation
        # manifests buildx adds (platform unknown/unknown) are not runnable and
        # are left unsigned; the next step uses one as the digest nobody
        # signed.
        #
        # Signed right after the push: the tags name the new index from the
        # push on, so for the minute this takes a hub resolving them finds it
        # unsigned — a warning, or a refusal under image_provenance: required.
        id: sign
        env:
          REF: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          INDEX: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect --raw "$REF@$INDEX" > /tmp/index.json
          platforms=$(jq -r '.manifests[] | select(.platform.os != "unknown") | .digest' /tmp/index.json)
          unsigned=$(jq -r '.manifests[] | select(.platform.os == "unknown") | .digest' /tmp/index.json | head -n1)
          [ -n "$platforms" ] || { echo "::error::$REF@$INDEX lists no platform manifests"; exit 1; }
          [ -n "$unsigned" ] || { echo "::error::$REF@$INDEX carries no attestation manifest to prove an unsigned digest is refused with"; exit 1; }
          digests="$INDEX $(echo "$platforms" | tr '\n' ' ')"
          for d in $digests; do
            echo "==> signing $REF@$d"
            cosign sign --yes "$REF@$d"
          done
          echo "digests=$digests" >> "$GITHUB_OUTPUT"
          echo "unsigned=$unsigned" >> "$GITHUB_OUTPUT"

      - name: The signatures verify against the pinned images identity
        # The exact check a hub makes before a sandbox runs one of these, against
        # the same literal pin as pkg/provenance.ImagesIdentityRegexp
        # (TestImagesWorkflowPinsTheSameIdentity holds the two together). A
        # mismatch fails here, before any hub is asked to run the image.
        env:
          REF: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          DIGESTS: ${{ steps.sign.outputs.digests }}
        run: |
          set -euo pipefail
          issuer="https://token.actions.githubusercontent.com"
          identity="^https://github\.com/${GITHUB_REPOSITORY}/\.github/workflows/publish-images\.yml@refs/(heads/main|tags/v[^/]+)$"
          for d in $DIGESTS; do
            cosign verify --certificate-oidc-issuer "$issuer" --certificate-identity-regexp "$identity" \
              "$REF@$d" > /dev/null
            echo "ok: $REF@$d"
          done

      - name: An unsigned digest and another identity are refused
        # The negative, as edge.yml's tamper check proves it for archives: a
        # digest nobody signed is reported unsigned, and the digests just
        # signed are refused by the release and edge pins, which must never
        # vouch for an image.
        env:
          REF: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          INDEX: ${{ steps.build.outputs.digest }}
          UNSIGNED: ${{ steps.sign.outputs.unsigned }}
        run: |
          set -euo pipefail
          issuer="https://token.actions.githubusercontent.com"
          images="^https://github\.com/${GITHUB_REPOSITORY}/\.github/workflows/publish-images\.yml@refs/(heads/main|tags/v[^/]+)$"
          if cosign verify --certificate-oidc-issuer "$issuer" --certificate-identity-regexp "$images" \
               "$REF@$UNSIGNED" > /tmp/unsigned.txt 2>&1; then
            echo "::error::cosign accepted $REF@$UNSIGNED, which nothing signed"; exit 1
          fi
          grep -q "no signatures found" /tmp/unsigned.txt || {
            echo "::error::an unsigned digest was refused for another reason than having no signature:"; cat /tmp/unsigned.txt; exit 1; }
          echo "ok: $REF@$UNSIGNED carries no signature and is refused"
          for other in \
            "^https://github\.com/${GITHUB_REPOSITORY}/\.github/workflows/edge\.yml@refs/heads/main$" \
            "^https://github\.com/${GITHUB_REPOSITORY}/\.github/workflows/release\.yml@refs/tags/v[^/]+$"; do
            if cosign verify --certificate-oidc-issuer "$issuer" --certificate-identity-regexp "$other" \
                 "$REF@$INDEX" > /tmp/other.txt 2>&1; then
              echo "::error::$REF@$INDEX verified against $other, a pin that must not vouch for an image"; exit 1
            fi
            grep -q "no matching" /tmp/other.txt || {
              echo "::error::$REF@$INDEX was refused under $other for another reason than its signer:"; cat /tmp/other.txt; exit 1; }
            echo "ok: $other does not accept it"
          done

      - name: The published hub verifies with its own cosign
        # The hub image bundles cosign (Task 20453), and this runs the published
        # hub's `cloop hub verify-image` — the check a dispatch makes, through
        # pkg/imagepolicy — with that cosign, from inside the distroless image:
        # its own digest verified, a digest nobody signed unsigned, and the same
        # digest under another identity a mismatch.
        if: matrix.target == 'runtime'
        env:
          REF: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          INDEX: ${{ steps.build.outputs.digest }}
          UNSIGNED: ${{ steps.sign.outputs.unsigned }}
        run: |
          set -euo pipefail
          hub="$REF@$INDEX"
          docker pull -q "$hub"
          docker run --rm --entrypoint /usr/local/bin/cosign "$hub" version
          verdict() { docker run --rm "$@" | jq -r .status; }
          got=$(verdict "$hub" hub verify-image --json "$hub" || true)
          [ "$got" = "verified" ] || { echo "::error::the hub reports its own image $got, not verified"; exit 1; }
          echo "ok: verified"
          got=$(verdict "$hub" hub verify-image --json "$REF@$UNSIGNED" || true)
          [ "$got" = "unsigned" ] || { echo "::error::the hub reports a digest nobody signed $got, not unsigned"; exit 1; }
          echo "ok: unsigned"
          edge="^https://github\.com/${GITHUB_REPOSITORY}/\.github/workflows/edge\.yml@refs/heads/main$"
          got=$(verdict -e CLOOP_PROVENANCE_IMAGES_IDENTITY="$edge" "$hub" hub verify-image --json "$hub" || true)
          [ "$got" = "mismatch" ] || { echo "::error::the hub reports another identity's pin $got, not mismatch"; exit 1; }
          echo "ok: mismatch"

      - name: The published image satisfies its contract
        # Pulling by digest is what makes this a check of the *published*
        # artifact rather than of a local build that happens to still be in the
        # daemon's cache. Only the native arch is exercised: running the arm64
        # manifest under QEMU here would test the emulator as much as the image.
        run: |
          set -euo pipefail
          ref="ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}"
          echo "verifying $ref"
          docker pull -q "$ref"

          user=$(docker image inspect "$ref" --format '{{.Config.User}}')
          [ -n "$user" ] && [ "${user%%:*}" != "0" ] && [ "$user" != "root" ] || {
            echo "::error::image runs as root by default (User=${user:-<unset>})"; exit 1; }
          echo "default user: $user"

          case "${{ matrix.target }}" in harness*)
            # The contract on pkg/executor/container.DefaultImage, asserted
            # against the artifact. Each of these is a failure mode that is
            # invisible inside a sandbox: a swallowed argv, a missing provider
            # harness, or a HOME the workload's uid cannot write to.
            ep=$(docker image inspect "$ref" --format '{{json .Config.Entrypoint}}')
            [ "$ep" = "null" ] || [ "$ep" = "[]" ] || {
              echo "::error::harness image must have no ENTRYPOINT; the driver denylists --entrypoint and the image must exec the argv it is handed (got $ep)"
              exit 1; }
            echo "entrypoint: none"

            # What the image says it carries (org.cloop.harnesses, Task 20450),
            # which a hub refuses a project by — so every program it lists is
            # asserted present below, as the uid the driver would pass.
            carries=$(docker image inspect "$ref" --format '{{index .Config.Labels "org.cloop.harnesses"}}')
            [ -n "$carries" ] || { echo "::error::harness image has no org.cloop.harnesses label"; exit 1; }
            echo "carries: $carries"

            # An arbitrary uid, because that is what the driver passes: --user is
            # derived from the project directory's owner, never from the image.
            # A read-only root and the driver's 512 MB tmpfs, because that is
            # where it runs: the copilot CLI must start without unpacking its
            # runtime into /tmp, which the image did at build time.
            docker run --rm --user 12345:12345 --cap-drop ALL \
              --security-opt no-new-privileges --network none --read-only \
              --tmpfs /tmp:rw,nosuid,nodev,exec,size=512m \
              -e CARRIES="$carries" \
              "$ref" sh -euc '
                test -x /usr/local/bin/cloop
                for p in $(echo "$CARRIES" | tr , " "); do
                  command -v "$p" >/dev/null || { echo "the label lists $p, which is not on PATH"; exit 1; }
                done
                command -v claude >/dev/null
                command -v git >/dev/null
                test -f /etc/ssl/certs/ca-certificates.crt
                git config --global user.email probe@example.invalid
                case ",$CARRIES," in *,copilot,*)
                  copilot --version
                  test "$COPILOT_AUTO_UPDATE" = false
                  used=$(du -sm /tmp | cut -f1)
                  [ "$used" -lt 32 ] || { echo "copilot --version wrote ${used} MB to /tmp: it unpacked its runtime at start"; exit 1; }
                  ;;
                esac
                echo "contract OK as uid $(id -u): $CARRIES, CA bundle, writable HOME=$HOME"'
            ;;
          *)
            docker run --rm "$ref" version
            ;;
          esac
