name: Documentation site (GitHub Pages)

# Publishes the documentation tree to https://blechschmidt.github.io/cloop/
#
# The site is not a second copy of the docs: scripts/build-docs.py stages this
# repository's own Markdown (docs/ and README.md) mirroring the repository
# layout so the relative links between pages survive, derives the navigation
# from docs/README.md, and Material for MkDocs renders it.
#
# The build job runs the same `make docs-check` and `make docs-site` developers
# run locally, so CI and local builds cannot drift. That build is --strict with
# `validation.anchors` turned up, which makes this workflow a gate as well as a
# publisher: a relative link that does not resolve, a dead #heading-anchor, or a
# page under docs/ that no section of docs/README.md lists all fail it. It runs
# for every push and pull request, including while a deploy is held (see the
# deploy job's concurrency). Pull requests build but do not deploy, so breakage
# is caught in review rather than on the live site.
#
# Every build is stamped: dist/docs-site/build.json names the commit it was
# built from. A deploy can stop without failing — held by GitHub, it simply
# never runs, and the live site keeps serving an old build under a page of
# cancelled runs — so docs-freshness.yml reads the stamp off the live site on
# a schedule and fails when the site lags main by more than six hours, naming
# the run that holds it. Locally: `make docs-freshness`.
#
# Publishing needs two repository settings, both one-time and both outside a
# workflow's control:
#
#   * Pages enabled with the "GitHub Actions" source. configure-pages is asked
#     to enable it below, but GITHUB_TOKEN cannot *create* a Pages site however
#     its permissions are set — that needs repository administration, which no
#     workflow token carries. Until an admin has enabled it once, that step
#     fails with "Create Pages site failed: Resource not accessible by
#     integration".
#   * the deploying branch allowed in the `github-pages` environment's
#     deployment-branch rules. This deploys from `main`, which is the default
#     branch, and the environment GitHub creates for Pages allows the default
#     branch — so this holds as configured. It is named here because it stops
#     holding the moment the deploy moves to any other branch.
#
# Neither is downgraded to a notice. A deploy that does not deploy is a failed
# deploy, and nobody reads a warning under a green check.
# No secrets are needed: deployment authenticates with the run's OIDC token.

on:
  # Kept in sync between push and pull_request by hand: GitHub Actions does not
  # support YAML anchors in workflow files.
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "website/**"
      - "README.md"
      # CONTRIBUTING.md is link-checked by check-docs.sh alongside docs/, so a
      # break in it must trigger this workflow or the gate cannot see it.
      - "CONTRIBUTING.md"
      - "scripts/build-docs.py"
      - "scripts/check-docs.sh"
      - "Makefile"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "website/**"
      - "README.md"
      # CONTRIBUTING.md is link-checked by check-docs.sh alongside docs/, so a
      # break in it must trigger this workflow or the gate cannot see it.
      - "CONTRIBUTING.md"
      - "scripts/build-docs.py"
      - "scripts/check-docs.sh"
      - "Makefile"
      - ".github/workflows/docs.yml"
  # Manual re-publish, e.g. after enabling Pages, changing branch policy, or
  # cancelling a held deploy whose queued successor has since gone.
  workflow_dispatch:

# No workflow-level concurrency: deploys are serialised on the deploy job, so
# that a held deploy never stops the build below from gating a push.

permissions:
  contents: read

jobs:
  build:
    name: Build site (strict)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The site toolchain is pure Python and pinned in
      # website/requirements.txt; no Go toolchain is involved.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: website/requirements.txt

      # Structural gate first: it names the offending file and the fix
      # ("docs/foo/bar.md is listed by no section of docs/README.md"), which is
      # a better error than the same problem surfacing as a missing nav entry.
      - name: Documentation structure check
        run: make docs-check

      # Stages the tree, generates the nav, renders with --strict. Creates its
      # own venv under dist/ from the pinned requirements, populated from the
      # pip cache above.
      - name: Build the site
        run: make docs-site

      # docs-freshness.yml judges the live site by this stamp. Checked on the
      # artifact about to be uploaded, so a build that stops stamping — or
      # stamps the wrong commit — fails here, in the push or pull request that
      # broke it, instead of reading as a stale site hours after it deploys.
      - name: The site names the commit it was built from
        run: |
          python3 - <<'PY'
          import json, os
          stamp = json.load(open("dist/docs-site/build.json", encoding="utf-8"))
          want = os.environ["GITHUB_SHA"]
          if stamp.get("commit") != want or stamp.get("dirty"):
              raise SystemExit(f"::error::dist/docs-site/build.json names "
                               f"{stamp.get('commit')} (dirty: {stamp.get('dirty')}), "
                               f"but this run built {want} from a clean checkout")
          print(f"build.json names {want}, built by {stamp.get('run')}")
          PY

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/docs-site

  deploy:
    name: Deploy to GitHub Pages
    # Pull requests validate the build above; only the branch publishes.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # One deploy per ref at a time — on this job alone.
    #
    # The group used to be the whole workflow's, which made a held deploy hold
    # the build too. On 2026-09-30 GitHub left run 36765144410's deploy
    # `waiting` on the github-pages environment, which requires no reviewer and
    # sets no wait timer, so there was nothing to wait for; it held the group
    # for days, and every later run queued whole and was cancelled by the next
    # push without building. No push in that time ran the strict build — the
    # dead-link and anchor gate — at all. Here the build runs for every push
    # whatever the deploys are doing, and only deploys queue.
    #
    # cancel-in-progress: false, because a deploy that has started must finish:
    # a half-published site is worse than a stale one. GitHub keeps one
    # *pending* deploy per group; a newer push's deploy replaces it, and the
    # replaced run ends `cancelled` with its build green. That is expected —
    # the newer deploy publishes a superset of it.
    #
    # A held deploy still holds this queue, deliberately: it keeps an old build
    # from ever publishing over a newer one, should GitHub release it late. The
    # group keeps its old name for the same reason, so deploys queued here also
    # wait behind a run that took it at the workflow level. Nothing publishes
    # until the waiting run is cancelled (Actions tab, Cancel workflow), and
    # nothing fails while it waits — docs-freshness.yml is what notices.
    concurrency:
      group: pages-${{ github.ref }}
      cancel-in-progress: false

    permissions:
      pages: write        # deploy to the Pages site
      id-token: write     # OIDC token deploy-pages authenticates with

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # Resolves the site's base URL, and re-asserts the "GitHub Actions"
      # source in case someone flips it back to branch-based publishing. It
      # cannot create the site from scratch — see the header — so a failure
      # here means Pages is not enabled on the repository, which is exactly the
      # condition that should stop the run rather than pass quietly.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
