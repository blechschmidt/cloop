name: Release

on:
  push:
    tags:
      - 'v*'

# The default GITHUB_TOKEN is read-only. Creating a release and uploading
# assets needs contents: write.
#
# id-token: write is what makes keyless signing possible, and it is worth being
# precise about what it grants: not a signing key, but the ability to ask
# GitHub for a short-lived OIDC token asserting *which workflow, in which
# repository, at which ref* is running. Fulcio exchanges that assertion for a
# certificate naming the same, and that name is the whole of what verification
# pins (pkg/provenance.DefaultIdentityRegexp). There is consequently no signing
# key anywhere in this repository to leak or rotate — and a workflow that could
# sign a release is a workflow that had to be running from a tag on this repo.
permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # The full history, because the release notes are generated from the
          # commits since the previous tag and a shallow clone has none of them.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          # go.mod, same as CI: its toolchain directive is pinned to a patch
          # release for security reasons (see the vulnerability-scan job in
          # ci.yml, where 13 of 14 findings were stdlib fixed by that pin).
          # A release binary built on an older toolchain would ship exactly the
          # vulnerabilities that job exists to keep out.
          go-version-file: go.mod
          cache: true

      - name: Build release artifacts
        # The same script a developer runs locally, rather than the build
        # inlined here — so "it built on my machine" and "it built in CI" are
        # the same statement, and so pkg/upgrade's drift gate has something to
        # assert against.
        run: |
          set -euo pipefail
          ./scripts/build-release.sh "${GITHUB_REF_NAME}" dist/release
          ls -la dist/release

      - name: The published binary reports the tag it was built from
        # `cloop upgrade --check` compares the running binary's version against
        # the latest release tag, and treats the literal string "dev" as "never
        # upgrade". A release whose -X ldflag silently failed to apply would
        # therefore install fine and then never see another update — a defect
        # with no symptom until the *second* release. Unpack what is about to
        # be published and make it say its own version.
        run: |
          set -euo pipefail
          mkdir -p /tmp/verify
          tar -xzf dist/release/cloop_linux_amd64.tar.gz -C /tmp/verify
          got=$(/tmp/verify/cloop version | head -1)
          echo "binary reports: $got"
          [ "$got" = "cloop ${GITHUB_REF_NAME}" ] || {
            echo "::error::built binary reports '$got', expected 'cloop ${GITHUB_REF_NAME}'"
            exit 1
          }

      - name: The published binary reports its tagged commit's place on main
        # The sequence is what a device's root helper orders builds by (Task
        # 20380): it refuses to install one whose sequence is lower than the
        # installed binary's. A release stamped with the wrong number — or none,
        # because an -X named a symbol that moved — would be refused by every
        # device that ever ran an edge build, or would let older edge builds
        # replace it. Counted here exactly as build-release.sh counts it, on the
        # full history this job checks out.
        run: |
          set -euo pipefail
          want_commit=$(git rev-parse HEAD)
          want_sequence=$(git rev-list --count --first-parent HEAD)
          /tmp/verify/cloop version --json > /tmp/verify/version.json
          python3 - "$want_commit" "$want_sequence" /tmp/verify/version.json <<'PY'
          import json, sys
          commit, sequence, path = sys.argv[1], int(sys.argv[2]), sys.argv[3]
          got = json.load(open(path))
          if got.get("commit") != commit or got.get("sequence") != sequence:
              sys.exit(f"::error::the binary reports commit {got.get('commit')!r} sequence {got.get('sequence')!r}, "
                       f"expected {commit} sequence {sequence}")
          print(f"ok: {commit} is sequence {sequence} on main's first-parent history")
          PY
          # Ordered against edge builds only if the tag is on main's first-parent
          # history; a tag elsewhere still installs, but say so.
          git rev-list --first-parent origin/main > /tmp/first-parent.txt || true
          grep -qx "$want_commit" /tmp/first-parent.txt ||
            echo "::warning::${GITHUB_REF_NAME} is not on origin/main's first-parent history, so its sequence is its own branch's count and orders against edge builds only approximately"

      - name: The checksums match the artifacts
        # Published so `cloop upgrade` can verify a download before unpacking
        # it; verified here so a corrupt upload is caught before anyone's
        # upgrade fails on a checksum mismatch they cannot act on.
        run: |
          set -euo pipefail
          cd dist/release
          sha256sum -c checksums.txt

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign every artifact and the checksum list
        # The checksums proved the download arrived intact. They cannot prove
        # where it came from: checksums.txt is served from this same release, so
        # whoever can replace an asset can replace its checksum in the same
        # breath and both sides of that comparison move together. A signature is
        # the part an attacker who does not control this workflow cannot forge.
        #
        # Every archive is signed individually rather than only checksums.txt,
        # so a consumer holding one artifact can verify it without fetching a
        # second file and without trusting the indirection through a list. The
        # list is signed too, because the installer checks the archive against
        # it and an unsigned list would leave that step vouching for nothing.
        #
        # --bundle writes a Sigstore bundle: signature, signing certificate and
        # Rekor inclusion proof in one file. cosign v3 removed
        # --output-signature/--output-certificate, so the separate .sig/.pem
        # pair is no longer emitted — and the bundle is the better artifact
        # regardless, since the transparency-log evidence travels with the
        # signature instead of being re-fetched at verification time.
        run: |
          set -euo pipefail
          cd dist/release
          for f in *.tar.gz checksums.txt; do
            echo "==> signing $f"
            # -y because there is no terminal here to confirm the transparency
            # log entry at; the entry is the point, not a side effect.
            cosign sign-blob --yes "$f" --bundle "$f.sigstore.json"
          done
          ls -la

      - name: The signatures verify against the pinned trust root
        # Signing that is never verified is a ritual. This runs the exact check
        # `cloop upgrade` and the bootstrap installer will run on a user's
        # machine, against the same constants — so if the identity Fulcio
        # issued does not match the one pkg/provenance pins, it fails here,
        # where the fix is a one-line edit, rather than on every device after
        # the release is public and irreversible.
        #
        # The identity is spelled out literally rather than read from the Go
        # source: hardcoded on both sides on purpose, so that changing one
        # without the other fails this step instead of shipping a release
        # nothing can install.
        run: |
          set -euo pipefail
          cd dist/release
          issuer="https://token.actions.githubusercontent.com"
          identity="^https://github\.com/${GITHUB_REPOSITORY}/\.github/workflows/release\.yml@refs/tags/v[^/]+$"
          echo "issuer:   $issuer"
          echo "identity: $identity"
          for f in *.tar.gz checksums.txt; do
            cosign verify-blob "$f" \
              --bundle "$f.sigstore.json" \
              --certificate-oidc-issuer "$issuer" \
              --certificate-identity-regexp "$identity"
            echo "ok: $f"
          done

      - name: A tampered artifact is actually refused
        # The verification above passing proves the signatures are valid. It
        # does not prove they would catch anything — a check that accepts
        # everything also accepts the genuine artifact. So corrupt a copy and
        # require the refusal, which is the property the whole pipeline exists
        # for and the only one that can silently stop holding.
        run: |
          set -euo pipefail
          cd dist/release
          cp cloop_linux_amd64.tar.gz /tmp/tampered.tar.gz
          cp cloop_linux_amd64.tar.gz.sigstore.json /tmp/tampered.tar.gz.sigstore.json
          printf 'malicious' >> /tmp/tampered.tar.gz
          if cosign verify-blob /tmp/tampered.tar.gz \
               --bundle /tmp/tampered.tar.gz.sigstore.json \
               --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
               --certificate-identity-regexp "^https://github\.com/${GITHUB_REPOSITORY}/\.github/workflows/release\.yml@refs/tags/v[^/]+$"; then
            echo "::error::cosign accepted a tampered archive. Signature verification is not protecting anything."
            exit 1
          fi
          echo "ok: the tampered archive was refused"

      - name: Extract this tag's section from CHANGELOG.md
        # The release body is the changelog entry, not GitHub's commit list.
        # Auto-generated notes are still appended below (the API pre-pends
        # whatever body it is given), so the page reads as "what changed, in
        # prose" followed by "every commit" rather than only the latter.
        #
        # A missing section is not fatal: it degrades to the auto-generated
        # notes alone, because failing a release over a changelog heading
        # would mean the artifacts are built and then thrown away.
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # Print lines between this version's "## [x.y.z]" heading and the
          # next "## " heading, dropping the heading itself.
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-body.md
          if [ -s release-body.md ]; then
            echo "found a CHANGELOG section for $version:"
            cat release-body.md
          else
            echo "::warning::no CHANGELOG.md section for $version; \
          falling back to auto-generated notes only"
          fi

      - name: Publish the GitHub release
        # Through the gh CLI, one asset at a time, each upload retried —
        # rather than softprops/action-gh-release, which lost v0.0.2 outright.
        # It uploaded all twelve assets at once; GitHub's upload service
        # answered one of them "Error creating asset temp dir", a server-side
        # failure the action does not retry (nor does its v3), and the job
        # failed with the tag pushed and no release behind it. So `latest`
        # stayed on 0.0.1's versioned asset names and the installer kept
        # 404ing for ten more days, through a fix that had been tagged.
        #
        # Draft first, published last: nothing reaches /releases/latest until
        # every asset is present, since a half-uploaded release breaks the
        # installer exactly as a missing one does. Re-running the job resumes
        # rather than duplicates — it reuses the draft, and --clobber makes
        # each upload idempotent.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists (a re-run); reusing it"
          else
            # --generate-notes appends GitHub's commit list to the changelog
            # section: "what changed, in prose", then "every commit".
            gh release create "$tag" --draft --verify-tag --title "$tag" \
              --notes-file release-body.md --generate-notes
          fi
          for f in dist/release/*.tar.gz dist/release/checksums.txt dist/release/*.sigstore.json; do
            for attempt in 1 2 3 4 5; do
              if gh release upload "$tag" "$f" --clobber; then
                echo "ok: $f"
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "::error::could not upload $f after $attempt attempts; the" \
                     "release is still a draft, so re-run this job to resume"
                exit 1
              fi
              echo "::warning::uploading $f failed (attempt $attempt); retrying"
              sleep $((attempt * 10))
            done
          done
          # --latest is what puts the release behind the /releases/latest
          # endpoint, which is the only one `cloop upgrade` and the installer
          # ever query. A release that is not "latest" is invisible to both.
          gh release edit "$tag" --draft=false --latest

      - name: The install script's download URL resolves
        # The one check that would have caught Task 20240 before a user did.
        #
        # Everything upstream of here can be green while the released artifacts
        # are unreachable: the build succeeds, the checksums match, the tag is
        # right — and the URL the bootstrap installer actually fetches still
        # 404s, because the asset it names was never published under that name.
        # Nothing in the repository can detect that, since it is a property of
        # the release as GitHub serves it. So ask GitHub.
        #
        # This is the literal URL from pkg/executor/install/bootstrap.go, not a
        # reconstruction of it: hardcoded on both sides on purpose, so that
        # changing one without the other fails here rather than on a device.
        run: |
          set -euo pipefail
          base="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download"
          # The .sigstore.json bundles are listed beside the artifacts they
          # sign, because the installer now fetches both and fails closed if
          # the bundle 404s. An unpublished bundle would therefore break every
          # install exactly as an unpublished archive does — the failure this
          # whole step exists to catch before a device does.
          for asset in cloop_linux_amd64.tar.gz cloop_linux_arm64.tar.gz \
                       cloop_linux_arm.tar.gz cloop_darwin_amd64.tar.gz \
                       cloop_darwin_arm64.tar.gz checksums.txt \
                       cloop_linux_amd64.tar.gz.sigstore.json \
                       cloop_linux_arm64.tar.gz.sigstore.json \
                       cloop_linux_arm.tar.gz.sigstore.json \
                       cloop_darwin_amd64.tar.gz.sigstore.json \
                       cloop_darwin_arm64.tar.gz.sigstore.json \
                       checksums.txt.sigstore.json; do
            # The "latest" pointer is updated asynchronously from the release
            # creation above, so a 404 on the first try means "not yet" at
            # least as often as it means "broken". Retry before believing it.
            for attempt in 1 2 3 4 5; do
              code=$(curl -sSL -o /dev/null -w '%{http_code}' "$base/$asset")
              [ "$code" = "200" ] && break
              echo "attempt $attempt: $asset -> HTTP $code, retrying"
              sleep 10
            done
            [ "$code" = "200" ] || {
              echo "::error::$base/$asset is HTTP $code. The install script at" \
                   "GET /install.sh fetches this exact URL and will fail for" \
                   "every new device."
              exit 1
            }
            echo "ok: $asset"
          done
