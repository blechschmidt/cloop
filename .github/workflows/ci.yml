name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    # Three checks that were all clean locally and none of which anything
    # stopped from regressing. `go vet` passed but was ungated; `gofmt` had
    # drifted to 137 unformatted files precisely because nothing looked; and a
    # go.mod that disagrees with `go mod tidy` is how an unused — or worse, a
    # silently downgraded — dependency survives review.
    #
    # They are separated from the vulnerability scan below so the two fail
    # independently: source hygiene is fixed by the author of the change,
    # a newly published CVE is not.

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          # go.mod, not a literal: its `toolchain` directive is pinned to a
          # patch release for security reasons, and a job that silently built
          # on an older 1.25.x would make that pin decorative.
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: gofmt
        # -l lists files whose formatting differs; the diff is printed because
        # a bare list of 137 paths tells you nothing about what to change.
        run: |
          set -euo pipefail
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt-clean:"
            echo "$unformatted"
            echo "--- diff ---"
            gofmt -d $unformatted
            echo
            echo "run: gofmt -w \$(gofmt -l .)"
            exit 1
          fi
          echo "all files are gofmt-clean"

      - name: go.mod and go.sum are tidy
        # Compared against a copy taken just beforehand, not against HEAD.
        # `git diff` would also fire on any unrelated uncommitted change to
        # these files, reporting "not tidy" for something that is merely
        # unstaged — right by luck in a clean CI checkout, and confusing for
        # anyone who runs this step locally to reproduce a failure.
        run: |
          set -euo pipefail
          cp go.mod /tmp/go.mod.before
          cp go.sum /tmp/go.sum.before
          go mod tidy
          if ! diff -u /tmp/go.mod.before go.mod || ! diff -u /tmp/go.sum.before go.sum; then
            echo "::error::go mod tidy changed go.mod/go.sum — run it and commit the result"
            exit 1
          fi
          echo "go.mod and go.sum are tidy"

  vulnerability-scan:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    # govulncheck reports only vulnerabilities whose vulnerable symbols this
    # code can actually reach, so a finding here is a call path, not an
    # advisory to triage. It exited 3 with 14 reachable findings before this
    # job existed — one grpc (the xDS RBAC engine and HTTP/2 transport, reached
    # from the remote executor) and 13 stdlib, landing on the TLS config, the
    # OIDC handler, the egress proxy and the dashboard's template escaping.
    #
    # This gate can newly fail on a commit that changed nothing, because a
    # vulnerability was published against code that was already there. That is
    # the intended behaviour: the alternative is finding out later.

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: The toolchain pin is in effect
        # 13 of the 14 findings this job was created for were stdlib, fixed by
        # the `toolchain` line in go.mod rather than by any dependency. If the
        # job silently built on an older 1.25.x, govulncheck would report them
        # again and the failure would look like a regression in this code.
        # Assert the pin resolved, so that failure mode names itself instead.
        run: |
          set -euo pipefail
          want=$(awk '/^toolchain /{print $2}' go.mod)
          got=$(go version | awk '{print $3}')
          echo "go.mod pins $want; the go command in this module reports $got"
          [ -n "$want" ] || { echo "::error::go.mod has no toolchain directive"; exit 1; }
          # Sort -V puts the older first; if `want` is not the older of the two
          # then the toolchain in use predates the pin.
          older=$(printf '%s\n%s\n' "${want#go}" "${got#go}" | sort -V | head -1)
          [ "$older" = "${want#go}" ] || {
            echo "::error::building with $got, which is older than the pinned $want"
            exit 1
          }

      - name: govulncheck
        run: |
          set -euo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@latest
          # Invoked by absolute path rather than relying on GOPATH/bin being on
          # PATH: if it were not, `govulncheck: command not found` would fail
          # this job for a reason that looks nothing like a vulnerability.
          "$(go env GOPATH)/bin/govulncheck" ./...

  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: The test suite does not depend on a clean home directory
        # cloop keeps per-user state outside the working tree (the
        # multi-project registry at ~/.cloop/projects.json, budgets and ledgers
        # under ~/.config/cloop). A test that writes there passes on a fresh
        # runner and fails on a developer's machine once enough state has
        # accumulated — which is exactly what happened: one dashboard test
        # appended an entry per run to a real registry until project index 99
        # resolved and three authorization tests began failing, for that
        # developer only. CI could not see it, because CI always starts empty.
        #
        # So dirty the home directory first, and make the suite prove it does
        # not care. Without this step every other run here is the clean case.
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cloop" "$HOME/.config/cloop"
          python3 - <<'PY'
          import json, os
          entries = [{"name": f"ci-decoy-{i}", "path": f"/nonexistent/ci-decoy-{i}"}
                     for i in range(150)]
          with open(os.path.expanduser("~/.cloop/projects.json"), "w") as f:
              json.dump({"projects": entries}, f)
          PY
          echo "seeded $HOME/.cloop/projects.json with 150 unresolvable projects"

      - name: Every package that reads $HOME isolates it in TestMain
        # The structural half of the same guarantee. The seeding above only
        # catches a leak in a package that happens to have a test asserting
        # against index 99; this one catches the next package to be added,
        # on the day it is added.
        run: go test -v ./tests/hermetic/

      - name: Test with race detector and coverage
        # -timeout, because `go test`'s default is a per-package 10 minutes and
        # pkg/ui is a large instrumented package that lands within a factor of
        # two of it. It has already gone over once: every handler that shells
        # out to a cloop subcommand was forking the test binary instead (see
        # pkg/ui/main_test.go), which put the package at ~10m and failed this
        # step outright. That is fixed, and the cliff should not be somewhere a
        # merely slower runner can fall off.
        run: go test -race -timeout 20m -coverprofile=coverage.out -covermode=atomic $(go list ./... | grep -v 'tests/e2e')

      - name: End-to-end integration tests
        run: |
          go build -o cloop .
          go test -v -timeout 120s ./tests/e2e/

      - name: The seeded home directory was left untouched
        # The assertion that makes the seeding meaningful, and it has to run
        # after the suite. If a test wrote to the real registry the entry count
        # changes here — failing at the leak, rather than at whichever
        # unrelated test the accumulated entries eventually break.
        #
        # if: always() so that a suite which fails *because* it polluted the
        # home directory still reports the actual cause.
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys
          p = os.path.expanduser("~/.cloop/projects.json")
          n = len(json.load(open(p))["projects"])
          if n != 150:
              sys.exit(f"::error::the test suite modified {p}: 150 entries before, "
                       f"{n} after — a test is writing to the user's home directory")
          print(f"{p} still has {n} entries; nothing wrote to it")
          PY
          # Nothing should have appeared beside it, or in the other per-user
          # state directory: pkg/globalbudget and pkg/cost write budget.yaml,
          # costs.jsonl and global.db under ~/.config/cloop, and an entry-count
          # check on the registry alone would not notice.
          unexpected=$(
            find "$HOME/.cloop" -mindepth 1 ! -name projects.json
            find "$HOME/.config/cloop" -mindepth 1
          )
          if [ -n "$unexpected" ]; then
            echo "::error::the test suite created files under the home directory:"
            echo "$unexpected"
            exit 1
          fi
          echo "no per-user state was written"

      - name: Upload coverage report
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 7

  security-conformance:
    name: Security Conformance
    runs-on: ubuntu-latest
    # A required job, not an advisory one. Every check in tests/security
    # asserts a property whose absence is invisible at runtime: an HTTP
    # handler that can fork, a container that runs as root, a lease that
    # outlives its grant. None of those break a feature test, so if this job
    # is allowed to fail the guarantees are documentation again.

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Threat-model conformance suite
        # -race because the single-use enrollment token check races eight
        # concurrent redemptions against each other, and a non-atomic guard
        # is exactly what it is looking for.
        #
        # The failing assertions are re-emitted as ::error:: annotations, not
        # only left in the log. Reading a job log needs a token; annotations
        # come back from the public check-runs API, so with this a maintainer
        # without push rights — and anyone reproducing a failure from outside
        # — can see *which* guarantee broke rather than "exit code 1". This
        # suite failed on every commit for months while the only thing visible
        # from outside was the exit code.
        # Annotations are derived from -json rather than grepped out of the
        # log. Grepping for `file.go:123:` cannot tell a t.Log from a t.Error
        # — they are the same shape — so the first version of this reported
        # eight failures when there was one, and the real assertion was the
        # last of them. -json attributes every line to a test and says which
        # tests failed, so only those are re-emitted.
        run: |
          set -o pipefail
          # -json is not readable in a job log, so the raw stream is kept for
          # the annotation pass below and the human form is reconstructed here
          # as the tests run. A line that is not an event (the go command's own
          # errors, which 2>&1 merges in) is passed through untouched.
          cat > /tmp/unjson.py <<'PY'
          import json, sys

          for line in sys.stdin:
              try:
                  event = json.loads(line)
              except ValueError:
                  sys.stdout.write(line)
                  continue
              if event.get('Action') == 'output':
                  sys.stdout.write(event.get('Output', ''))
          PY
          if go test -json -race -v -timeout 15m ./tests/security/ 2>&1 \
               | tee /tmp/security.json \
               | python3 -u /tmp/unjson.py; then
            exit 0
          fi
          echo "::error::the threat-model conformance suite failed; the assertions are below"
          python3 - <<'PY'
          import json, collections

          out, failed = collections.defaultdict(list), []
          with open('/tmp/security.json') as fh:
              for line in fh:
                  try:
                      e = json.loads(line)
                  except ValueError:
                      continue
                  key = (e.get('Package', ''), e.get('Test') or '')
                  if e.get('Action') == 'output':
                      out[key].append(e.get('Output', ''))
                  elif e.get('Action') == 'fail' and e.get('Test'):
                      failed.append(key)

          # A parent fails because its subtest did, and its own output is just
          # the summary line — the subtest's annotation is the one carrying the
          # assertion. Emitting both puts a content-free entry next to the real
          # one, inside a per-step annotation budget.
          names = {t for _, t in failed}
          failed = [(p, t) for p, t in failed
                    if not any(o != t and o.startswith(t + '/') for o in names)]

          noise = ('=== RUN', '=== PAUSE', '=== CONT', '=== NAME')
          shown = 0
          for pkg, test in failed:
              body = [l.rstrip() for l in out[(pkg, test)]
                      if l.strip() and not l.lstrip().startswith(noise)]
              if not body:
                  continue
              # GitHub caps annotations per step; the first failures are the
              # ones worth reading, and the log above still has all of them.
              shown += 1
              if shown > 20:
                  print(f'::notice::{len(failed) - 20} further failing test(s) '
                        f'are in the log above')
                  break
              msg = '%0A'.join(l.replace('%', '%25').replace('\r', '')
                               for l in body[:12])
              print(f'::error title={test}::{msg}')
          PY
          exit 1

      - name: Fuzz the remote agent protocol framing
        # A short smoke fuzz on every push: long enough to catch a decoder
        # that a refactor made panic, short enough not to gate a PR on luck.
        # The corpus persists in the Go build cache across runs, so coverage
        # accumulates rather than restarting from the seeds each time.
        run: |
          go test ./tests/security/ -run XXX -fuzz FuzzFrameDecoding   -fuzztime 60s
          go test ./tests/security/ -run XXX -fuzz FuzzFrameTruncation -fuzztime 60s
          go test ./tests/security/ -run XXX -fuzz FuzzRedactStringNeverEmitsACredentialBody -fuzztime 60s

      - name: Upload fuzz failure corpus
        # A crash writes its reproducer into testdata/fuzz/. Without this it
        # lives only on the runner and is gone before anyone can look.
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: fuzz-corpus
          path: tests/security/testdata/fuzz/
          retention-days: 30
          if-no-files-found: ignore

  docs-drift:
    name: Documentation drift
    runs-on: ubuntu-latest
    # Ten enterprise subsystems shipped before docs/ existed, which is how
    # documentation normally rots: nothing fails when a new executor backend,
    # credential kind, role or permission ships undocumented. The feature works,
    # the tests pass, and the gap is invisible until an operator hits it. This
    # job reads those enumerations out of the source with go/ast and fails when
    # one of them is missing from docs/, so a new subsystem cannot ship
    # undocumented.

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Docs cover every executor kind, secret kind, role and permission
        run: go test -v ./tests/docs/

      - name: Relative links inside docs/ resolve
        # The relative links between these documents are the navigation. A
        # renamed or moved file leaves them pointing at nothing, and no other
        # job here would notice.
        run: |
          set -euo pipefail
          broken=0
          for src in $(find docs -name '*.md'); do
            for link in $(grep -oE '\]\([^)]+\)' "$src" | sed 's/^](//;s/)$//'); do
              case "$link" in http*|mailto:*|'#'*) continue ;; esac
              target="$(dirname "$src")/${link%%#*}"
              if [ ! -e "$target" ]; then
                echo "$src: broken link -> $link"
                broken=1
              fi
            done
          done
          [ "$broken" = 0 ] || { echo "docs contain broken relative links"; exit 1; }
          echo "all relative links resolve"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Every mermaid diagram still renders
        # The README's lifecycle diagram is the first thing a visitor sees, and
        # a mermaid block GitHub cannot parse does not fail loudly — it renders
        # as a grey "Unable to render rich display" box, in a file no other job
        # here compiles. That is how this one drifted: it used `\n` for line
        # breaks, which is not documented mermaid syntax (the repository's own
        # docs/ diagrams use <br/>), and a stray backslash that had been
        # printing as "\.cloop/state" for as long as the diagram existed.
        #
        # mermaid.parse is the same parser GitHub runs, driven under jsdom
        # rather than a headless browser: parsing is where a diagram fails to
        # render, and skipping the browser removes a Chromium download and the
        # system libraries it needs from the critical path of a docs check.
        run: |
          set -euo pipefail
          # Installed outside the working tree: node_modules inside it would be
          # untracked clutter, and would put ~40 vendored README diagrams in
          # front of the extractor below.
          npm install --no-audit --no-fund --silent --prefix /tmp/mermaid-tools \
            mermaid@11.12.0 jsdom@26.1.0

          rm -rf /tmp/mermaid && mkdir -p /tmp/mermaid
          python3 - <<'PY'
          import pathlib, re, subprocess

          fence = re.compile(r'^```mermaid[ \t]*\r?\n(.*?)^```', re.S | re.M)
          found = 0
          # git ls-files, so this sees the repository's own Markdown and
          # nothing a tool happened to leave in the checkout.
          for name in subprocess.check_output(['git', 'ls-files', '*.md'], text=True).split():
              text = pathlib.Path(name).read_text(encoding='utf-8')
              for m in fence.finditer(text):
                  line = text[:m.start()].count('\n') + 1
                  out = pathlib.Path('/tmp/mermaid') / f'{name.replace("/", "__")}#L{line}.mmd'
                  out.write_text(m.group(1), encoding='utf-8')
                  found += 1
          print(f'extracted {found} mermaid diagram(s)')
          if found == 0:
              raise SystemExit('::error::no mermaid diagrams found - the extractor is broken')
          PY

          # The script lives beside the node_modules it imports: ESM resolves
          # bare specifiers by walking up from the importing file and ignores
          # NODE_PATH, so a heredoc piped to `node --input-type=module` cannot
          # find them.
          cat > /tmp/mermaid-tools/check.mjs <<'JS'
          import { readdirSync, readFileSync } from 'node:fs';
          import { JSDOM } from 'jsdom';

          const dom = new JSDOM('<!DOCTYPE html><body></body>', { pretendToBeVisual: true });
          globalThis.window = dom.window;
          globalThis.document = dom.window.document;

          const mermaid = (await import('mermaid')).default;
          mermaid.initialize({ startOnLoad: false });

          let failed = 0;
          // Every diagram is checked before exiting: a first failure should not
          // hide the second one from whoever has to fix them.
          for (const f of readdirSync('/tmp/mermaid').sort()) {
            const where = f.replace(/\.mmd$/, '').replaceAll('__', '/');
            try {
              await mermaid.parse(readFileSync(`/tmp/mermaid/${f}`, 'utf8'));
              console.log(`  renders: ${where}`);
            } catch (e) {
              failed++;
              console.log(`::error::${where} is not valid mermaid, so GitHub will show ` +
                          `"Unable to render rich display" instead of the diagram:`);
              console.log(String(e.message ?? e).split('\n').map(l => `    ${l}`).join('\n'));
            }
          }
          process.exit(failed === 0 ? 0 : 1);
          JS
          node /tmp/mermaid-tools/check.mjs

  deploy-artifacts:
    name: Deployment artifacts
    runs-on: ubuntu-latest
    # The deployment artifacts are the only part of this repository that
    # `go build` cannot check. A Dockerfile that produces an image which
    # cannot start, a chart that renders manifests the API server rejects, or
    # a securityContext the container cannot actually run under are all
    # invisible to every other job here — and all of them surface for the
    # first time in front of an operator. So this job boots the things.

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Build the hub image
        # Plain docker build, loaded into the local daemon: the steps below
        # need to run it, not push it.
        run: |
          docker build \
            --build-arg VERSION=ci-${GITHUB_SHA::7} \
            --build-arg REVISION=${GITHUB_SHA} \
            --build-arg CREATED=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            -t cloop-hub:ci .

      - name: Assert the image is what the chart assumes
        # Every one of these is depended on somewhere else: the chart's
        # runAsNonRoot fails a root image, the compose stack's HEALTHCHECK
        # needs the label-documented entrypoint, and deploy/README.md tells
        # operators the image runs as 65532.
        run: |
          set -euo pipefail
          user=$(docker inspect cloop-hub:ci --format '{{.Config.User}}')
          [ "$user" = "65532:65532" ] || { echo "image runs as '$user', expected 65532:65532"; exit 1; }
          for label in title source version revision licenses; do
            v=$(docker inspect cloop-hub:ci --format "{{index .Config.Labels \"org.opencontainers.image.$label\"}}")
            [ -n "$v" ] || { echo "missing OCI label: $label"; exit 1; }
          done
          echo "image OK: user=$user size=$(docker image inspect cloop-hub:ci --format '{{.Size}}')"

      - name: Boot the container hardened and probe it
        # The hardening flags are the assertion. A build that quietly needs a
        # writable rootfs, a capability, or root passes `docker run` and fails
        # here, which is where it should fail.
        run: |
          set -euo pipefail
          docker run -d --name hub -p 18080:8080 \
            --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            -v hub-state:/var/lib/cloop \
            -e CLOOP_UI_TOKEN=ci-token \
            cloop-hub:ci

          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:18080/healthz; then break; fi
            [ "$i" = 30 ] && { docker logs hub; echo "hub never became reachable"; exit 1; }
            sleep 1
          done

          for ep in healthz readyz; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:18080/$ep")
            [ "$code" = 200 ] || { docker logs hub; echo "/$ep returned $code, expected 200"; exit 1; }
            echo "/$ep -> 200"
          done

          # The dashboard must not be open. A regression that drops the auth
          # middleware would still pass the probes above.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/api/state)
          [ "$code" = 401 ] || { echo "unauthenticated /api/state returned $code, expected 401"; exit 1; }

          # The in-image probe the Dockerfile's HEALTHCHECK relies on. There
          # is no curl in the image, so if this breaks the HEALTHCHECK breaks
          # silently and the container reports healthy forever.
          docker exec hub /usr/local/bin/cloop hub healthcheck --endpoint readyz

          docker rm -f hub >/dev/null

      - name: Bootstrap generates a config the binary accepts
        # `cloop hub bootstrap` renders commented YAML from a template rather
        # than marshalling a struct, so a field rename in pkg/config can leave
        # it emitting a config that no longer parses. It self-checks by
        # loading the result — this asserts the self-check is reached and that
        # the security-relevant lines are actually in the output.
        run: |
          set -euo pipefail
          mkdir -p /tmp/bootstrap && cd /tmp/bootstrap
          # --user matters: bootstrap writes 0600 files, so running the
          # container as root would leave a .cloop the runner user (uid 1001)
          # cannot read, and every assertion below would fail on permissions
          # rather than on content.
          docker run --rm -v /tmp/bootstrap:/w -w /w --user "$(id -u):$(id -g)" cloop-hub:ci \
            hub bootstrap --behind-proxy \
              --external-url https://hub.example.com \
              --oidc-issuer https://idp.example.com \
              --oidc-client-id cloop-hub > out.txt
          grep -q 'allow_host_process: false' .cloop/config.yaml
          grep -q 'default_role: none'        .cloop/config.yaml
          grep -q 'CLOOP_SECRET_KEY='         .cloop/hub.env
          [ "$(stat -c %a .cloop/hub.env)" = 600 ] || { echo "hub.env is not 0600"; exit 1; }
          grep -q 'ProtectSystem=strict'      out.txt   # the printed systemd unit

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: helm lint
        # Three value sets, because the interesting templates are the
        # conditional ones: nothing enabled, everything enabled, and the
        # in-cluster executor that adds RBAC in a second namespace.
        run: |
          set -euo pipefail
          helm lint deploy/helm/cloop-hub \
            --set secrets.create=true --set secrets.secretKey=lint --set secrets.uiToken=lint
          helm lint deploy/helm/cloop-hub \
            --set secrets.existingSecret=external \
            --set executor.kubernetes.enabled=true \
            --set oidc.enabled=true --set oidc.issuer=https://idp.example.com \
            --set ingress.enabled=true
          helm lint deploy/helm/cloop-hub \
            --set secrets.existingSecret=external \
            --set persistence.enabled=false

      - name: Chart guard rails refuse what they should
        # These fail() calls are load-bearing — one of them is the only thing
        # stopping a hub from installing with no CLOOP_SECRET_KEY at all. A
        # template refactor that drops a guard makes the chart *more*
        # permissive, which no positive test would notice.
        run: |
          set -euo pipefail
          refuses() {
            local why="$1"; shift
            if helm template guard deploy/helm/cloop-hub "$@" >/dev/null 2>&1; then
              echo "chart accepted what it must refuse: $why"; exit 1
            fi
            echo "refused: $why"
          }
          refuses "no secret source"
          refuses "both secret sources" --set secrets.create=true --set secrets.existingSecret=x
          refuses "secrets.create with no master key" --set secrets.create=true
          # No OIDC and no token is a hub with authentication switched off,
          # which is the single worst thing this chart could quietly install.
          refuses "a generated Secret with neither SSO nor a dashboard token" \
            --set secrets.create=true --set secrets.secretKey=k
          refuses "oidc enabled with no issuer" \
            --set secrets.existingSecret=x --set oidc.enabled=true
          # SSO "on" while no config reaches the hub renders a release that
          # reports single sign-on and serves token auth.
          refuses "oidc enabled with no config delivered" \
            --set secrets.existingSecret=x --set oidc.enabled=true \
            --set oidc.issuer=https://idp.example.com --set config.fromConfigMap=false
          # Would bind Pod create/delete to the namespace's default SA.
          refuses "executor RBAC with no named ServiceAccount" \
            --set secrets.existingSecret=x --set executor.kubernetes.enabled=true \
            --set serviceAccount.create=false
          refuses "an existingClaim that persistence.enabled would discard" \
            --set secrets.existingSecret=x --set persistence.enabled=false \
            --set persistence.existingClaim=precious
          refuses "ingress host disagreeing with externalURL" \
            --set secrets.existingSecret=x --set ingress.enabled=true \
            --set ingress.host=other.example.com

      - name: Create a kind cluster
        # kubectl needs a cluster even for --dry-run=client: it resolves REST
        # mappings from the discovery API before it can validate anything.
        uses: helm/kind-action@v1
        with:
          cluster_name: cloop-ci

      - name: helm template | kubectl apply --dry-run
        run: |
          set -euo pipefail
          kubectl create namespace cloop
          kubectl create namespace cloop-workloads

          render() {
            helm template cloop deploy/helm/cloop-hub --namespace cloop \
              --set image.repository=cloop-hub --set image.tag=ci \
              --set secrets.create=true --set secrets.secretKey=ci-key \
              --set secrets.uiToken=ci-token \
              --set executor.kubernetes.enabled=true \
              --set oidc.enabled=true --set oidc.issuer=https://idp.example.com \
              --set ingress.enabled=true "$@"
          }
          render | kubectl apply --dry-run=client -f -
          # Server-side too: client-side never sees the API server's schema, so
          # a misspelled securityContext field passes it happily.
          render | kubectl apply --dry-run=server -f -

      - name: Install the chart and wait for the hub to be ready
        # The strongest check here. --wait only returns once the readiness
        # probe passes, which means the PVC mounted, the ConfigMap landed
        # inside it, fsGroup made it writable, and SQLite opened — under
        # readOnlyRootFilesystem, runAsNonRoot and capabilities dropped.
        run: |
          set -euo pipefail
          kind load docker-image cloop-hub:ci --name cloop-ci
          helm install cloop deploy/helm/cloop-hub --namespace cloop \
            --set image.repository=cloop-hub --set image.tag=ci --set image.pullPolicy=Never \
            --set secrets.create=true --set secrets.secretKey=ci-key \
            --set secrets.uiToken=ci-token \
            --set executor.kubernetes.enabled=true \
            --wait --timeout 5m

      - name: Assert the installed hub answers both probes
        run: |
          set -euo pipefail
          kubectl -n cloop exec deploy/cloop-cloop-hub -- \
            /usr/local/bin/cloop hub healthcheck --endpoint healthz
          kubectl -n cloop exec deploy/cloop-cloop-hub -- \
            /usr/local/bin/cloop hub healthcheck --endpoint readyz

      - name: Assert the executor Role grants exactly the Pod verbs
        # The Role is the boundary the in-cluster executor runs inside, so
        # widening it is a security change. Asserting both directions means a
        # copy-pasted `"*"` fails here instead of shipping.
        run: |
          set -euo pipefail
          SA=system:serviceaccount:cloop:cloop-cloop-hub

          # `kubectl auth can-i` exits 1 when the answer is "no", which under
          # `set -e` would abort on the very checks that are supposed to see a
          # denial. Read the word, ignore the status.
          can() {
            kubectl auth can-i "$1" "$2" -n "$3" --as "$SA" 2>/dev/null || true
          }
          grants() {
            [ "$(can "$1" "$2" "$3")" = yes ] \
              || { echo "executor cannot $1 $2 in $3 — the driver needs it"; exit 1; }
            echo "  grants: $1 $2 in $3"
          }
          denies() {
            [ "$(can "$1" "$2" "$3")" = no ] \
              || { echo "executor Role is too wide: it grants $1 $2 in $3"; exit 1; }
            echo "  denies: $1 $2 in $3"
          }

          for v in create get list watch delete; do grants "$v" pods cloop-workloads; done
          grants get pods/log cloop-workloads

          # And nothing else. The driver never mutates a Pod after creating
          # it, and an executor that could read Secrets would make the secret
          # broker decorative.
          denies update pods    cloop-workloads
          denies patch  pods    cloop-workloads
          denies get    secrets cloop-workloads
          denies list   secrets cloop-workloads

          # The hub's own namespace holds its Secrets and its ServiceAccount
          # token; the Role is bound in the workload namespace only.
          denies create pods    cloop
          denies get    secrets cloop

      - name: Run a workload through the in-cluster executor
        # End-to-end: the Pod's own ServiceAccount token is read from its
        # projected volume, used to authenticate to the API server, and a real
        # workload Pod is created, watched, streamed and deleted. This is the
        # only check that exercises pkg/executor/kubernetes against a live API
        # server rather than a fake.
        run: |
          kubectl -n cloop exec deploy/cloop-cloop-hub -- \
            /usr/local/bin/cloop executor test kubernetes

      - name: Hub diagnostics on failure
        if: failure()
        run: |
          kubectl -n cloop get pods -o wide || true
          kubectl -n cloop describe pods || true
          kubectl -n cloop logs deploy/cloop-cloop-hub --tail=200 || true
          kubectl -n cloop-workloads get pods -o wide || true
