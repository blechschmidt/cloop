name: Released installer

# Does the installer the hub hands out actually work, right now, against the
# release GitHub is currently serving?
#
# Every other check in this repository answers a question about the working
# tree, and none of them can answer this one. scripts/build-release.sh,
# pkg/upgrade.assetNameFor and the shell in bootstrap.go are gated against each
# other; the container suite drives the real script against a mirror built from
# the tree. After Task 20240 all of them were green and `curl … | sh` still
# 404'd on every device, because the fix was never released — the published
# artifacts still carried `cloop_0.0.1_…` in their names, and the URL the
# installer hardcodes resolves only against a fixed name.
#
# That failure has no commit. It appeared the moment the code moved ahead of the
# release and would have persisted for as long as that release stayed current,
# so a job on the pull-request path could not have caught it and a job triggered
# by a release could not either — the release predates the check.
#
# Hence a clock. This is the only workflow in the repository whose failure
# means "ship something", not "fix your diff", which is also why it does not
# gate pull requests: a contributor must not be blocked by a release they did
# not cut and cannot re-cut.
#
# The second job asks the same question of the changelog (Task 20421): a
# security fix merged to main reaches no device until a release carries it, so
# an [Unreleased] Security entry older than 14 days fails it. v0.0.4 stayed
# current while sixteen of them piled up, a network-reachable hub without
# sign-in and stored XSS among them.
on:
  schedule:
    # 06:00 UTC daily. Cheap — four HTTP requests and one small container.
    - cron: '0 6 * * *'
  workflow_dispatch:
  # And as soon as a release run finishes, against what it published: the
  # release's own last step checks that the URLs resolve, not that the
  # installer installs from them. A release published with GITHUB_TOKEN fires
  # no release event, so this follows the workflow instead.
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  contents: read

jobs:
  published-release:
    name: The published release installs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: The published release satisfies the installer
        # The expected asset names come from scripts/build-release.sh --list
        # inside the test, so adding a platform to the release matrix extends
        # this check automatically rather than leaving that platform's users to
        # find the gap for themselves.
        env:
          CLOOP_PUBLISHED_RELEASE: '1'
        run: |
          set -euo pipefail
          go test ./pkg/executor/install/ -run Published -v

      - name: Say what to do about it
        if: failure()
        run: |
          echo "::error::The installer served at GET /install.sh cannot install \
          the current release. Cut a new release from a commit whose \
          scripts/build-release.sh publishes unversioned asset names — the \
          fix is a tag, not a code change."

  security-fixes-released:
    name: No security fix waits more than 14 days for a release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # The age of an entry is git blame's date for its oldest line, and a
          # shallow clone dates every older line by its boundary commit — so
          # every entry would look new. The script refuses a shallow clone.
          fetch-depth: 0

      - name: Every [Unreleased] Security entry is younger than 14 days
        run: python3 scripts/unreleased-security-age.py --max-days 14

      - name: Say what to do about it
        if: failure()
        run: |
          echo "::error::A security fix has waited more than 14 days on main \
          without a release, so no device, installer or release-channel upgrade \
          has it. Cut a release: turn [Unreleased] into a version in \
          CHANGELOG.md, add it to pkg/version/releases.go and tag that commit."
