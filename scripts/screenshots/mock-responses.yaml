# Scripted answers for the offline `mock` provider (`cloop run --provider mock`).
#
# These are what the demo hub's first few tasks actually produce: the run is
# real — real steps, real event history, real per-task results — it just never
# reaches a network. That is the point. A screenshot of a hand-written plan
# shows what someone typed; a screenshot of this shows what cloop did.
#
# Rules match on a substring of the prompt, which carries the task title, and
# the first match wins. Every response ends in TASK_DONE because that is the
# signal the orchestrator reads out of the last few lines to mark a task
# complete.
rules:
  - substring: "**Task 1: Define the idempotency key contract"
    response: |
      Wrote `docs/idempotency.md` and fixed the contract:

      - The merchant supplies `Idempotency-Key` on every capture. A missing key
        is a 400, not a silently non-idempotent capture.
      - A key is scoped to (merchant, endpoint) and honoured for 24 hours.
      - A replay inside the window returns the stored response verbatim, with
        `Idempotency-Replayed: true` so the client can tell.
      - A key reused with a *different* request body is a 422. Reusing a key for
        a different payment is a client bug and must not be papered over.

      TASK_DONE

  - substring: "**Task 2: Add the idempotency_keys table"
    response: |
      Added `migrations/0031_idempotency_keys.sql`:

      - `(merchant_id, endpoint, key)` is the primary key; `response_body` and
        `response_status` hold the first answer; `request_digest` catches reuse
        with a changed body.
      - The retention sweep deletes in bounded batches and takes an advisory
        lock first, so running it on three replicas does the work once rather
        than three times.

      Verified against a 2M-row fixture: the sweep holds no lock longer than
      40 ms.

      TASK_DONE

  - substring: "**Task 3: Replay a captured payment"
    response: |
      `POST /v1/payments/capture` now resolves the key before it does anything
      else:

      - first use  → capture, store the response, return it
      - replay     → return the stored response byte for byte, 200 with
                     `Idempotency-Replayed: true`
      - in flight  → 409 with `Retry-After: 1`, because the first answer does
                     not exist yet

      The in-flight case is the one worth calling out: returning a conflict
      *only* while the original request is still running is what makes a client
      retry loop converge instead of stampeding.

      Tests cover all three paths plus a concurrent double-submit.

      TASK_DONE

  - substring: "**Task 4: Route capture, refund and void"
    response: |
      Capture, refund and void each write one `payment.*` audit event inside the
      same transaction as the state change, so an event cannot exist for a
      transition that rolled back — or be missing for one that did not.

      Each event carries the actor, the idempotency key, the acquirer reference
      and the before/after state. Replays do not write a second event; they
      record a `replayed` counter on the original.

      TASK_DONE

  - substring: "**Task 5: Back the acquirer client off exponentially"
    response: |
      Retry budget is 3 attempts per request with full-jitter backoff starting
      at 200 ms, and a breaker that opens after 20 consecutive failures.

      Still open: the breaker is per process, so twelve replicas can each spend
      20 failures before any of them stops. Sharing the state needs a store the
      client does not have yet — noted in the task result rather than fixed
      here, because doing it badly is worse than the current behaviour.

      TASK_DONE

  - substring: "**Task 6: Contract tests against the acquirer sandbox"
    response: |
      Pinned the acquirer's documented responses as fixtures and wired them into
      the suite.

      TASK_DONE

# Anything not matched above still completes, so the run never wedges on a task
# nobody scripted.
default: |
  Done.

  TASK_DONE
