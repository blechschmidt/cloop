<!DOCTYPE html>
<!--
  cloop for display glasses (Task 20194).

  A separate document from the dashboard, sized for a monocular heads-up
  display of roughly 600x600 logical pixels that the wearer drives with a wrist
  band rather than a pointer. Three design rules follow from that hardware and
  explain most of what looks unusual below:

    1. Black is transparent. A waveguide display adds light to the world; it
       cannot subtract any. A light theme would paint a bright rectangle over
       whatever the wearer is looking at, so the background stays #000 and the
       content is near-white with large type.

    2. Everything is one column of large targets. There is no hover, no
       right-click, and no precise pointing. Rows are full width and tall, and
       the only gestures are "activate a row" and "go back".

    3. As few round trips as possible. The markup and CSS are one document,
       because a device on a phone's link pays dearly for each request; the
       script is the one asset beside it (js/page/glasses.js), since the hub's
       policy runs no inline script (Task 20408), and its content-hashed URL is
       cached for good after the first load. Data comes from /api/glasses/*,
       which projects records down to the handful of fields drawn here.

  The credential arrives in the query string, because adding an app by URL is
  the only input channel the device has. The script lifts it out on load and
  sends it in an Authorization header from then on, so it appears in exactly
  one request rather than in every one — and the same value never has to be
  re-typed by a wearer who has no keyboard.

  Output is not the only thing the hardware constrains. Adding a task (Tasks
  20238, 20243) has to be expressible with arrow keys and Enter, because that
  is all the device sends — there is no microphone and no text input for a web
  app here. So the "+ Add task" button opens a list: speech where a microphone
  exists (the paired phone), and otherwise ready-made tasks the hub derives
  from the project's own plan. See the "adding a task" section of the script.

  Input (Tasks 20237, 20242). The band and the temple touch strip are not a
  pointer and not a touchscreen: the glasses OS translates every gesture into
  an arrow-key or Enter keydown aimed at document.activeElement, and delivers
  nothing else — no touch, no wheel, no coordinates. It also supplies no focus
  engine of its own, so moving the selection is this page's job and nobody
  else's. That is handled in the "gestures" section, which is the only place a
  gesture is interpreted, and which assumes as little about the runtime as it
  can: it reads three spellings of every key and keeps the selection in a
  variable rather than reading focus back out of the document.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark">
<title>cloop</title>
<!-- The launcher tile (Task 20228). PNG only: the device rejects SVG and wants
     at least 52px, and these are the two <link> rels its guide names.

     Deliberately no <link rel="manifest"> here, though the device would read
     one. A manifest declares a start_url, and the only URL that works on the
     glasses is the tokenised one the wearer saved — a launcher that honoured
     start_url would relaunch the app at "/" and drop the credential the device
     has no keyboard to re-enter. The dashboard links the manifest; this page
     gets its icon from tags that cannot rewrite where it opens. -->
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<style>
  :root {
    --fg: #f2f4f8;
    --muted: #9aa4b2;
    --line: #2a2f3a;
    --accent: #6ea8ff;
    --ok: #4ade80;
    --run: #fbbf24;
    --bad: #f87171;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: #000; color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 22px; line-height: 1.35;
    /* The wearer cannot select text with a band, and an accidental selection
       highlight is a bright block that is hard to clear. */
    -webkit-user-select: none; user-select: none;
    /* There is nothing to the side of this layout, by design — it is one
       column of full-width rows. Refusing the axis outright means a sideways
       gesture can never be spent scrolling instead of moving the selection,
       whatever a future row puts in it. The vertical axis is unaffected: with
       one axis hidden the other computes to auto rather than visible. */
    overflow-x: hidden;
    /* And the sideways gesture belongs to the page, not to the compositor.
       overflow-x above stops a horizontal scroll from existing; this stops the
       browser from *claiming* the axis before the page is consulted. Without
       it a horizontal drag can be swallowed as a pan that then scrolls nothing,
       and the touchmove handler below never gets the chance to call
       preventDefault. pan-y keeps the vertical axis native, which is the half
       of the gesture model the wearer asked to keep. */
    touch-action: pan-y;
  }
  #app { padding: 14px 16px 28px; max-width: 900px; margin: 0 auto; }

  /* ...and nothing should be overflowing in the first place. Task titles carry
     paths, image refs and Go identifiers — ghcr.io/blechschmidt/cloop-harness
     :latest, OrchestratorTaskTimeoutMinutesDefault — and a token with no space
     in it is wider than this column at every viewport the device reports, so
     the default `normal` wrapping pushed a horizontal scroller out from under
     the task list while the project list, whose names are short, stayed clean.
     `word-break` first for engines that predate `anywhere`. */
  .row, .row .name, .row .meta, #sub, #heard, .detail, .detail .body {
    word-break: break-word;
    overflow-wrap: anywhere;
  }

  header {
    display: flex; align-items: center; gap: 12px;
    padding-bottom: 10px; margin-bottom: 10px;
    border-bottom: 2px solid var(--line);
  }
  #back {
    display: none; flex: 0 0 auto;
    min-width: 64px; min-height: 56px;
    font-size: 26px; font-weight: 700;
    color: var(--accent); background: transparent;
    border: 2px solid var(--line); border-radius: 12px;
    cursor: pointer;
  }
  #back.on { display: block; }
  #title {
    flex: 1 1 auto; font-size: 26px; font-weight: 700;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #reload {
    flex: 0 0 auto; min-width: 64px; min-height: 56px;
    font-size: 24px; color: var(--muted); background: transparent;
    border: 2px solid var(--line); border-radius: 12px; cursor: pointer;
  }
  /* Feedback for a refresh that no longer blanks the screen. Since the list is
     patched in place there is nothing else to tell the wearer that the tap
     registered, so the control itself dims while the request is out. */
  #reload.busy { opacity: .45; }

  #sub { color: var(--muted); font-size: 19px; margin-bottom: 12px; }

  .row {
    display: block; width: 100%; text-align: left;
    padding: 14px 16px; margin-bottom: 10px;
    background: #10131a; color: var(--fg);
    border: 2px solid var(--line); border-radius: 14px;
    font: inherit; cursor: pointer;
  }
  .row:active { border-color: var(--accent); }
  .row .name { font-size: 24px; font-weight: 650; }
  .row .meta { color: var(--muted); font-size: 18px; margin-top: 6px; }

  /* The ring is the entire cursor. There is no pointer on this device, so the
     only way a wearer knows what a pinch will activate is this outline — it
     has to read at a glance, against whatever the world behind the waveguide
     happens to be.

     Two selectors, not one. `.sel` is the page's own cursor and the one that
     always paints; `:focus` is there so a real browser — the phone the glasses
     tether through, or a screen reader — shows the same thing when focus is
     moved by something other than a swipe. The page can no longer depend on
     :focus alone, because it cannot depend on the device's focus model: see
     the note above the gesture handler. */
  .focusable:focus, .focusable.sel {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(110, 168, 255, .55), 0 0 20px rgba(110, 168, 255, .35);
  }
  /* The three chrome controls carry id-level borders, and an id outranks a
     class however many times you repeat it — so their accent has to be said
     again at the same specificity or they alone would glow without changing
     outline. */
  #back:focus, #reload:focus, #more:focus,
  #back.sel, #reload.sel, #more.sel { border-color: var(--accent); }
  .row.focusable:focus, .row.focusable.sel { background: #172033; }

  /* A status dot carries the state at a glance; the word is there for the
     cases where a small coloured dot on a see-through display is ambiguous
     against a bright background. */
  .dot { display: inline-block; width: 14px; height: 14px; border-radius: 50%;
         margin-right: 8px; vertical-align: -1px; background: var(--muted); }
  .dot.in_progress, .dot.running { background: var(--run); }
  .dot.done, .dot.complete { background: var(--ok); }
  .dot.failed, .dot.timed_out { background: var(--bad); }
  .dot.pending { background: var(--muted); }
  .dot.skipped { background: #6b7280; }

  .bar { height: 8px; border-radius: 4px; background: #222836; margin-top: 10px; }
  .bar > i { display: block; height: 100%; border-radius: 4px; background: var(--accent); }

  #filters { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .chip {
    padding: 10px 14px; min-height: 48px;
    background: #10131a; color: var(--muted);
    border: 2px solid var(--line); border-radius: 999px;
    font: inherit; font-size: 18px; cursor: pointer;
  }
  .chip.on { color: #000; background: var(--accent); border-color: var(--accent); font-weight: 700; }

  #more {
    display: none; width: 100%; padding: 14px; margin-top: 4px;
    background: transparent; color: var(--accent);
    border: 2px dashed var(--line); border-radius: 14px; font: inherit; cursor: pointer;
  }
  #more.on { display: block; }

  /* The two primary actions: opening the Add screen (Task 20243) and, on it,
     starting a recording (Task 20238). Solid rather than dashed like #more,
     because these start something rather than extending the list, and on an
     additive display a filled border is the strongest "this is the action"
     signal available without spending colour. Never both on screen at once —
     #add lives on the task list and #dictate on the screen it opens — so they
     can look identical. */
  #add, #dictate {
    display: none; width: 100%; padding: 14px; margin-bottom: 12px;
    background: #10131a; color: var(--accent);
    border: 2px solid var(--accent); border-radius: 14px; font: inherit;
    font-weight: 650; cursor: pointer;
  }
  #add.on, #dictate.on { display: block; }
  #dictate.rec { color: var(--bad); border-color: var(--bad); }
  /* Push-to-talk (Task 20252): a hold on a phone must stay a hold. Without
     touch-action the browser reclaims the gesture as a scroll partway through
     a sentence; without the selection rules a long press pops the text-callout
     menu over the button the finger is still on. */
  #dictate { touch-action: none; -webkit-touch-callout: none;
             -webkit-user-select: none; user-select: none; }
  #add:disabled, #dictate:disabled { opacity: .5; }
  /* The wearable cannot reach a microphone at all (see the note in the script),
     so where that is true speech is one muted line rather than a control: a
     ring stop that cannot do anything is worse than no ring stop. The line now
     sits on the Add screen, where the wearer went looking for it, instead of
     on the task list where it read as an apology for a missing button. */
  #micnote { display: none; color: var(--muted); font-size: 17px; margin-bottom: 12px; }
  #micnote.on { display: block; }
  /* The transcript, shown large enough to check at a glance before it becomes
     a row in a plan. */
  #heard {
    margin: 4px 0 14px; padding: 14px 16px;
    background: #10131a; border: 2px solid var(--line); border-radius: 14px;
    font-size: 24px; -webkit-user-select: text; user-select: text;
  }

  .detail h2 { font-size: 25px; margin: 0 0 10px; }
  .detail .block { margin-top: 16px; }
  .detail .label { color: var(--muted); font-size: 17px; text-transform: uppercase; letter-spacing: .06em; }
  .detail .body {
    margin-top: 6px; white-space: pre-wrap; word-break: break-word;
    -webkit-user-select: text; user-select: text;
  }
  /* Host execution (Task 20244). The hub's claim is that it never spawns a
     harness on the host; a task that did is an exception, and on a display
     this small it has to be findable without reading. */
  .detail .block.host .label,
  .detail .block.host .body { color: var(--bad); }
  #msg { padding: 18px 0; color: var(--muted); font-size: 20px; }
  #msg.bad { color: var(--bad); }
</style>
</head>
<body>
<div id="app">
  <header>
    <button id="back" class="focusable" type="button" hidden aria-label="Back">&#8592;</button>
    <div id="title">cloop</div>
    <button id="reload" class="focusable" type="button" aria-label="Refresh">&#8635;</button>
  </header>
  <div id="sub"></div>
  <div id="filters"></div>
  <button id="add" class="focusable" type="button" hidden>&#43; Add task</button>
  <button id="dictate" class="focusable" type="button" hidden>&#127908; Speak a new task</button>
  <div id="micnote"></div>
  <div id="msg"></div>
  <div id="list"></div>
  <button id="more" class="focusable" type="button" hidden>More</button>
</div>
<script src="{{asset:glasses.js}}"></script>
</body>
</html>
