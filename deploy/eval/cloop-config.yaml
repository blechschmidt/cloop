# cloop hub configuration for the docker-compose evaluation stack.
#
# Generated by:
#
#   cloop hub bootstrap --behind-proxy \
#     --external-url https://cloop.localtest.me:8443 \
#     --oidc-issuer   https://cloop.localtest.me:8443/dex \
#     --oidc-client-id cloop-hub \
#     --admin-email   admin@example.com
#
# and then given one role_mapping so the stack demonstrates all three RBAC
# outcomes. It is committed rather than generated at `compose up` time so the
# eval stack is reproducible and so this file can be read before running it —
# but it is a real bootstrap output, not a hand-written approximation, and
# regenerating it with the command above should produce the same thing.
#
# This is the hosted profile: deliberately stricter than cloop's built-in
# defaults, which target a single developer in a git checkout. Loosening one
# of these is a decision, not a cleanup.
#
# Secrets are NOT here. They arrive from the environment
# (CLOOP_OIDC_CLIENT_SECRET, CLOOP_SECRET_KEY), which is what lets this file
# be committed at all.

# ── Execution policy ────────────────────────────────────────────────────────
executors:
  # The control: with this false, no run can ever fork a harness on the hub
  # host. Requests to start one are refused with 409 naming the alternatives
  # rather than silently falling back. Every executor below, and every remote
  # agent that enrolls, is an isolated one.
  #
  # Leaving it unset is NOT the same as true-with-intent: the Executors tab
  # reports "unset (permissive)" so an unhardened hub is visible at a glance.
  allow_host_process: false

  # Container sandbox on the hub host. Off by default even here — a hub that
  # can run containers can run them as whatever the image says, so enabling it
  # is a decision about this host's blast radius.
  # container:
  #   enabled: true
  #   runtime: podman        # empty auto-detects; podman preferred (rootless)
  #   image: ghcr.io/blechschmidt/cloop:latest
  #   network: none          # grant egress per-project via the egress broker
  #   cpus: 2
  #   memory: 4g

  # Ephemeral-Pod executor. in_cluster authenticates as the hub Pod's own
  # ServiceAccount and is what deploy/helm/cloop-hub configures; on bare metal
  # leave it false and grant a kubeconfig through the secret broker instead.
  # kubernetes:
  #   enabled: true
  #   in_cluster: true
  #   namespace: cloop-workloads   # NOT the hub's own namespace
  #   image: ghcr.io/blechschmidt/cloop:latest
  #   cpu_limit: "2"
  #   memory_limit: 4Gi

  # Scoped egress: lease the hub's Internet connection to sandboxes that have
  # none, per host and with byte quotas, instead of giving them a network.
  # egress:
  #   enabled: true
  #   listen_addr: 127.0.0.1:8899
  #   max_session_minutes: 15

# ── Image trust ─────────────────────────────────────────────────────────────
# Which container images a *project* may name in its own .cloop/sandbox.yaml.
#
# That file arrives by `git pull`, and the image it names is not data the
# sandbox processes — it is the sandbox. Without a policy here, "the hub never
# runs untrusted code on the host" is true and beside the point, because the
# code inside the container was chosen by a pull request.
#
# Deny by default: with allowed_registries set, an image from anywhere else is
# refused with the rule named, and the refusal is recorded in the audit trail.
# The rules apply to project-supplied images only — the executor's own image is
# the operator's choice, made in this same file.
#
# The executors above are commented out in this stack, so nothing here has an
# effect until one is enabled. It is written out anyway because enabling an
# executor without an image policy is the gap this section exists to close.
sandbox:
  image_policy:
    # Matching is on the parsed reference. "ghcr.io" here does not admit
    # "ghcr.io.attacker.example/x" or "attacker.example/ghcr.io/x", and a
    # Unicode lookalike of it is refused as a malformed reference.
    allowed_registries:
      - ghcr.io

    # Narrow to particular repositories. A trailing "/*" matches at a
    # path-component boundary, so this does not match ghcr.io/acme-evil/x.
    # allowed_repos:
    #   - ghcr.io/acme/*

    # A tag is a mutable pointer: `image: python:3.12` is a different artifact
    # in June than it was in March. The container executor resolves an accepted
    # tag to a digest and runs that, so this is belt-and-braces there — but a
    # Kubernetes Pod carries the reference to a kubelet that resolves it later
    # on some node, where nothing but this can close the gap.
    require_digest: true

    # Verify signatures with cosign. Off here because the published hub image
    # does not ship the cosign binary, and with it on a hub that cannot verify
    # refuses every project image rather than admitting them unchecked. Turn it
    # on with an image that has cosign, plus keys or identities:
    #
    # require_signature: true
    # cosign_identities:
    #   - issuer: https://token.actions.githubusercontent.com
    #     subject_regexp: ^https://github\.com/acme/.+
    require_signature: false

# ── HTTP surface ────────────────────────────────────────────────────────────
ui:
  # The public URL. Used to build OIDC redirects and to decide which origins
  # may open a WebSocket, so it must match what a browser actually types.
  external_url: https://cloop.localtest.me:8443

  # A WebSocket is exempt from the same-origin policy, so an unpinned hub can
  # be driven by any page the operator's browser happens to load. Pinned.
  allowed_ws_origins:
    - https://cloop.localtest.me:8443
  # TLS terminates at a reverse proxy or Ingress, so the hub itself speaks
  # plain HTTP and must never be published directly.
  #
  # The proxy MUST set X-Forwarded-Proto: https. That header is what tells
  # cloop the browser's connection was encrypted, and therefore what marks
  # the session cookie Secure. Without it every login issues a cookie that a
  # downgrade attack can replay over http.
  tls: {}

  # Bound the resources one client can consume before authenticating.
  max_websocket_conns: 256
  max_websocket_conns_per_ip: 16
  max_request_body_bytes: 10485760

  oidc:
    enabled: true
    issuer: https://cloop.localtest.me:8443/dex
    client_id: cloop-hub
    # client_secret comes from CLOOP_OIDC_CLIENT_SECRET in .cloop/hub.env.
    redirect_url: https://cloop.localtest.me:8443/auth/callback
    scopes: [openid, profile, email, groups]

    # Deny-by-default. A user who authenticates but matches no mapping below
    # gets "none" and can read nothing. The alternative — a default of viewer
    # — means everyone in the IdP is inside the hub the moment SSO is turned
    # on, which is rarely what anyone means by "we enabled SSO".
    default_role: none

    admin_emails:
      - admin@example.com

    # Claim → role bindings. Roles form a ladder:
    #   viewer     read projects and executors
    #   operator   + start/stop runs, mutate tasks
    #   maintainer + grant/revoke secrets, write config
    #   admin      + manage executors and users, read the audit trail
    #
    # dex's static-password connector emits no groups, so the evaluation
    # stack binds on the email claim. A real IdP emits groups and you would
    # bind on those instead — the mechanism is identical, only the claim
    # name changes.
    role_mappings:
      - {claim: email, value: operator@example.com, role: operator}

    session_ttl_hours: 12
    cookie_secure: always

# ── Rate limiting ───────────────────────────────────────────────────────────
# Per-IP token bucket in front of every route except /healthz and /readyz,
# which must answer even while a client is being throttled or an orchestrator
# will restart a hub that is merely busy.
rate_limit:
  requests_per_second: 20
  burst: 50

# ── Providers ───────────────────────────────────────────────────────────────
# API keys are read from the environment (ANTHROPIC_API_KEY, OPENAI_API_KEY),
# not from this file. Set them in .cloop/hub.env alongside the other secrets.
provider: anthropic
anthropic:
  model: claude-opus-4-6
