# Reverse proxy for the evaluation stack: terminates TLS and presents the hub
# and the identity provider as one origin.
#
# Mounted into conf.d/, so this file is inside nginx's `http` context — which
# is why the `map` below is legal here.

# WebSocket upgrade plumbing. cloop's dashboard is WebSocket-first: without
# this the UI loads and then silently never updates, which looks like a cloop
# bug and is a proxy misconfiguration.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8443 ssl;
    http2 on;
    server_name cloop.localtest.me localhost;

    # Generated by the `certs` service with `cloop hub tls-init`.
    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:4m;

    # cloop streams task output; buffering it turns a live log into a log that
    # arrives in 4 KiB bursts.
    proxy_buffering off;

    # Match ui.max_request_body_bytes (10 MiB). nginx defaults to 1m, so
    # anything in between would be rejected by the proxy with a 413 that never
    # reaches the hub and never appears in its audit trail — a request the
    # operator can see failing and cannot see recorded.
    client_max_body_size 10m;

    # The identity provider, under the same origin as the hub so one issuer
    # URL works from both the browser and the hub. The trailing slashes on
    # both sides matter: they make nginx rewrite /dex/foo → /dex/foo rather
    # than stripping the prefix dex expects to see.
    location /dex/ {
        proxy_pass http://dex:5556/dex/;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # Read-only git origins, for `make e2e-stack`.
    #
    # A remote executor materialises a project by fetching it from an https
    # URL — never from the hub's filesystem, which is the whole point of it
    # being remote. So the end-to-end test needs an origin that both the hub
    # and the executor can reach and that presents a certificate they trust,
    # and the cheapest such thing is this: the proxy already has both.
    #
    # This is git's "dumb HTTP" protocol — plain static files plus the index
    # that `git update-server-info` writes. Fetch-only, which is exactly the
    # authority a sandbox should have over the source it was given: it may
    # read the tree, and it returns its work through the executor's own
    # channel rather than by pushing here.
    #
    # Empty on a plain `docker compose up`; autoindex is off so an empty
    # directory is a 403 rather than a listing of the operator's repositories.
    location /git/ {
        alias /srv/git/;
        autoindex off;
    }

    location / {
        proxy_pass http://cloop:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        # Load-bearing, not decorative. cloop reads this to decide whether the
        # browser's connection was encrypted, and therefore whether to mark
        # the session cookie Secure. Drop it and every login hands out a
        # cookie that can be replayed over plain http.
        proxy_set_header X-Forwarded-Proto https;

        # A dashboard WebSocket is idle between events; the 60s default would
        # tear it down and leave the UI reconnecting in a loop.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }
}
