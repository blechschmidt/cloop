apiVersion: v2
name: cloop-hub
description: cloop control plane — dashboard, REST API and remote executor endpoint
type: application

# Chart version tracks the chart's own shape. appVersion follows the cloop
# release the default image tag points at; overriding image.tag without
# overriding this is fine and expected.
version: 0.2.0
appVersion: "dev"

home: https://github.com/blechschmidt/cloop
sources:
  - https://github.com/blechschmidt/cloop
keywords:
  - cloop
  - ai
  - agents
  - control-plane

annotations:
  # Replicas form one hub cluster over one SQLite database, so they scale out
  # across processes on one node, not across nodes: the chart pins them to the
  # node holding the ReadWriteOnce volume. Capacity to run work scales out
  # through executors instead.
  cloop.dev/replicas: "one node; see docs/architecture/hub-cluster.md"
