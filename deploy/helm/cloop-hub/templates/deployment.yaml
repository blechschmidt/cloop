{{- include "cloop-hub.validate" . -}}
{{- $gp := include "cloop-hub.gitProxy" . | fromJson }}
{{- $kg := include "cloop-hub.kubeGuard" . | fromJson }}
{{- $mt := include "cloop-hub.monitorTLS" . | fromJson }}
{{- $extraCA := dig "configMap" "" (default dict .Values.extraCACerts) }}
{{- $kms := include "cloop-hub.kms" . | fromJson }}
{{- $kmsSocket := and $kms.enabled (eq $kms.provider "kmsv2") }}
{{- $kmsTransit := and $kms.enabled (eq $kms.provider "transit") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cloop-hub.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cloop-hub.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    {{- if .Values.strategy }}
    {{- toYaml .Values.strategy | nindent 4 }}
    {{- else if gt (int .Values.replicaCount) 1 }}
    # A replacement joins the hub cluster before a member leaves, and the
    # leaving member hands its runs and agents over on SIGTERM — so an upgrade
    # never has zero members serving.
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    {{- else }}
    # Recreate for a single replica: without the co-location term below (it
    # applies only once Pods can coexist), a surge Pod could be scheduled onto
    # a node that cannot mount the ReadWriteOnce volume, and the rollout would
    # hang. Set strategy.type=RollingUpdate to opt into the term and zero-
    # downtime upgrades.
    type: Recreate
    {{- end }}
  selector:
    matchLabels:
      {{- include "cloop-hub.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cloop-hub.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- if or .Values.config.fromConfigMap .Values.podAnnotations $mt.caBundle (include "cloop-hub.monitorsEnabled" .) .Values.secrets.create }}
      annotations:
        {{- if .Values.config.fromConfigMap }}
        # Roll the Pod when the config changes. Without this a `helm upgrade`
        # that tightens the execution policy updates the ConfigMap and leaves
        # the old policy running, which is the worst possible outcome for a
        # security setting.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- if .Values.secrets.create }}
        # Roll the Pods when the chart-managed Secret changes: a key in it is
        # read at start, so a new CLOOP_SECRET_KEY, or a previous one added for
        # a change of root, takes effect by a rolling restart — which is the
        # procedure (Task 20425).
        checksum/secrets: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with $mt.caBundle }}
        # The monitors read their CA at start; a new one needs a new Pod.
        checksum/monitor-ca: {{ . | sha256sum }}
        {{- end }}
        {{- if and (include "cloop-hub.monitorsEnabled" .) $mt.selfSigned }}
        # A generated certificate is reissued when the names it must cover
        # change, and the monitors load theirs at start.
        checksum/monitor-names: {{ include "cloop-hub.monitorDNSNames" . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "cloop-hub.serviceAccountName" . }}
      # The in-cluster executor authenticates with this token. When the
      # Kubernetes executor is off there is nothing for it to do, and not
      # mounting it means a compromised hub has no cluster credential at all.
      automountServiceAccountToken: {{ and .Values.serviceAccount.automountServiceAccountToken .Values.executor.kubernetes.enabled }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: hub
          image: {{ include "cloop-hub.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Every interface, explicitly (Task 20393): the Service, the
          # kubelet's probes and the other replicas all reach the Pod at its
          # IP, never at its loopback. The chart installs a hub with sign-in
          # (oidc.enabled or CLOOP_UI_TOKEN, see _validate.tpl); a hub without
          # either refuses this address and the Pod says why in its log.
          args: ["ui", "--listen", "0.0.0.0", "--port", "8080", "--no-browser"]
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            {{- if $gp.enabled }}
            - name: git-proxy
              containerPort: {{ $gp.port }}
              protocol: TCP
            {{- end }}
            {{- if $kg.enabled }}
            - name: kube-guard
              containerPort: {{ $kg.port }}
              protocol: TCP
            {{- end }}
          env:
            # `cloop ui` resolves .cloop against the process working
            # directory and the project registry against $HOME. Both point at
            # /var/lib/cloop so one volume holds all persistent state.
            - name: HOME
              value: /var/lib/cloop
            # Where the other replicas reach this one: a member forwards a
            # request only one member can answer — a Stop for a run it
            # streams, a login callback for a login it began — to that
            # member's own address. The Pod IP rather than the Service, which
            # would pick any replica. A host rather than a URL because the IP
            # may be IPv6; cloop adds the brackets, the scheme and the port.
            - name: CLOOP_CLUSTER_ADVERTISE_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            # The root key reaches the hub as a file, never as an environment
            # variable (Task 20425): in the environment it is in
            # /proc/<pid>/environ and in `kubectl get pod -o yaml`. The Secret
            # is mounted below; CLOOP_SECRET_KEY_FILE names the current key,
            # and the directory is read as a credentials directory, so adding
            # CLOOP_SECRET_KEY_PREVIOUS to the Secret is all a change of root
            # needs here — nothing in these values changes.
            - name: CLOOP_SECRET_KEY_FILE
              value: /etc/cloop/root-key/cloop-secret-key
            - name: CREDENTIALS_DIRECTORY
              value: /etc/cloop/root-key
            # Blank, and so unset to the hub. envFrom below loads every key of
            # the Secret into the environment, these two included, and an
            # explicit entry is the one thing that wins over it.
            - name: CLOOP_SECRET_KEY
              value: ""
            - name: CLOOP_SECRET_KEY_PREVIOUS
              value: ""
            {{- if $extraCA }}
            # Added to the image's own bundle, not substituted for it: Go reads
            # its default certificate file and then every file in these
            # directories.
            - name: SSL_CERT_DIR
              value: /etc/cloop/extra-ca
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "cloop-hub.secretName" . }}
            {{- with .Values.secrets.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            # The state directory itself, not its parent: the parent comes
            # from the image and stays read-only, so the only writable path
            # in the container is the one holding state.
            - name: state
              mountPath: /var/lib/cloop/.cloop
            # And its projects/ directory at the projects root, which is
            # projects/ in the hub's home unless ui.projects_root says
            # otherwise. A project's directory may not be inside the state
            # directory — it is what a sandbox is given, and the state beside
            # it is the hub's — and nothing else in the container is writable,
            # so without this a project created by name had nowhere to go
            # (Task 20418). A subPath of the same volume: the rest of the image
            # stays read-only, and one volume still holds everything.
            - name: state
              mountPath: /var/lib/cloop/projects
              subPath: projects
            {{- if .Values.config.fromConfigMap }}
            # Nested inside that mount, read-only. Kubernetes orders mounts
            # by path depth, so the volume is in place before this lands on
            # top of it.
            - name: config
              mountPath: /var/lib/cloop/.cloop/config.yaml
              subPath: config.yaml
              readOnly: true
            {{- end }}
            # readOnlyRootFilesystem leaves no writable temp dir; Go's
            # os.CreateTemp and anything shelling out needs one.
            - name: tmp
              mountPath: /tmp
            {{- if include "cloop-hub.monitorTLSFromFiles" . }}
            # The credential monitors' certificate and key.
            - name: monitor-tls
              mountPath: /etc/cloop/monitor-tls
              readOnly: true
            {{- if include "cloop-hub.monitorCAKnown" . }}
            - name: monitor-ca
              mountPath: /etc/cloop/monitor-ca
              readOnly: true
            {{- end }}
            {{- end }}
            {{- if $extraCA }}
            - name: extra-ca
              mountPath: /etc/cloop/extra-ca
              readOnly: true
            {{- end }}
            - name: root-key
              mountPath: /etc/cloop/root-key
              readOnly: true
            {{- if $kmsSocket }}
            # The KMS v2 plugin's socket, shared with the sidecar below
            # (Task 20433).
            - name: kms-socket
              mountPath: {{ $kms.kmsv2.socketDir }}
            {{- end }}
            {{- if $kmsTransit }}
            {{- if $kms.transit.tokenSecret.name }}
            - name: kms-token
              mountPath: /etc/cloop/kms-token
              readOnly: true
            {{- else }}
            - name: kms-sa-token
              mountPath: /var/run/secrets/cloop-kms
              readOnly: true
            {{- end }}
            {{- if $kms.transit.caConfigMap.name }}
            - name: kms-ca
              mountPath: /etc/cloop/kms-ca
              readOnly: true
            {{- end }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- if and $kmsSocket $kms.plugin.enabled }}
        # The KMS v2 plugin (Task 20433): it holds the credentials to the
        # vendor's KMS, and the hub holds none — it asks the plugin over the
        # socket to wrap and unwrap its key-encryption keys. A sidecar rather
        # than a node-level plugin so its socket is reachable by this Pod's
        # containers alone. The hub waits kms.startupTimeout for it to answer.
        - name: kms-plugin
          image: {{ $kms.plugin.image | quote }}
          imagePullPolicy: {{ $kms.plugin.imagePullPolicy }}
          {{- with $kms.plugin.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $kms.plugin.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $kms.plugin.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml $kms.plugin.securityContext | nindent 12 }}
          volumeMounts:
            - name: kms-socket
              mountPath: {{ $kms.kmsv2.socketDir }}
            {{- with $kms.plugin.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with $kms.plugin.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
        {{- with $kms.plugin.extraContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
        - name: state
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (printf "%s-state" (include "cloop-hub.fullname" .)) }}
          {{- else }}
          # No PVC: every restart starts from an empty database. Fine for a
          # smoke test, silently destructive for anything else.
          emptyDir: {}
          {{- end }}
        {{- if .Values.config.fromConfigMap }}
        - name: config
          configMap:
            name: {{ include "cloop-hub.fullname" . }}-config
            defaultMode: 0444
        {{- end }}
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        {{- if include "cloop-hub.monitorTLSFromFiles" . }}
        - name: monitor-tls
          secret:
            secretName: {{ include "cloop-hub.monitorTLSSecretName" . }}
            items:
              - {key: tls.crt, path: tls.crt}
              - {key: tls.key, path: tls.key}
            # Group-readable: the hub runs as the Pod's fsGroup, never as the
            # file's owner.
            defaultMode: 0440
        {{- if include "cloop-hub.monitorCAKnown" . }}
        - name: monitor-ca
          configMap:
            name: {{ include "cloop-hub.monitorCAName" . }}
            defaultMode: 0444
        {{- end }}
        {{- end }}
        {{- if $extraCA }}
        - name: extra-ca
          configMap:
            name: {{ $extraCA }}
            defaultMode: 0444
        {{- end }}
        # The root key and, during a change of root, the previous one, named
        # as the hub reads systemd credentials. Group-readable: the hub runs as
        # the Pod's fsGroup and never as the files' owner, and this is the one
        # shape of key file the hub accepts that it does not own — owned by
        # root, readable by its own group and by nobody else.
        - name: root-key
          secret:
            secretName: {{ include "cloop-hub.secretName" . }}
            items:
              - {key: CLOOP_SECRET_KEY, path: cloop-secret-key}
              - {key: CLOOP_SECRET_KEY_PREVIOUS, path: cloop-secret-key-previous}
            defaultMode: 0440
            # A missing item is skipped rather than refusing the Pod, which is
            # what makes the previous key optional. A missing current key is
            # not tolerated by the hub, which refuses to start without the
            # file CLOOP_SECRET_KEY_FILE names.
            optional: true
        {{- if $kmsSocket }}
        # Where the KMS v2 plugin listens and the hub dials (Task 20433).
        - name: kms-socket
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        {{- with $kms.plugin.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- end }}
        {{- if $kmsTransit }}
        {{- if $kms.transit.tokenSecret.name }}
        # A Vault token you keep renewed; the hub re-reads it on every call.
        - name: kms-token
          secret:
            secretName: {{ $kms.transit.tokenSecret.name }}
            items:
              - {key: {{ $kms.transit.tokenSecret.key }}, path: token}
            defaultMode: 0440
        {{- else }}
        # A service account token for Vault's Kubernetes auth method, with
        # Vault's audience: it is no credential to the API server, and the
        # hub needs none (automountServiceAccountToken above).
        - name: kms-sa-token
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken:
                  audience: {{ $kms.transit.kubernetes.audience | quote }}
                  expirationSeconds: 3600
                  path: token
        {{- end }}
        {{- if $kms.transit.caConfigMap.name }}
        - name: kms-ca
          configMap:
            name: {{ $kms.transit.caConfigMap.name }}
            items:
              - {key: {{ $kms.transit.caConfigMap.key }}, path: ca.crt}
            defaultMode: 0444
        {{- end }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- /*
        Pods that can run at once share one SQLite database, and SQLite's WAL
        needs all of its processes on one kernel — so they are required onto
        the node already running one of them, which is also the node the
        ReadWriteOnce volume is attached to. The first Pod matches its own
        term, which the scheduler treats as satisfied when nothing else does.
        Appended to whatever .Values.affinity sets rather than replacing it.
      */}}
      {{- $affinity := deepCopy (default dict .Values.affinity) }}
      {{- if include "cloop-hub.coexist" . }}
      {{- $podAffinity := default dict (get $affinity "podAffinity") }}
      {{- $required := default list (get $podAffinity "requiredDuringSchedulingIgnoredDuringExecution") }}
      {{- $term := dict "topologyKey" "kubernetes.io/hostname" "labelSelector" (dict "matchLabels" (include "cloop-hub.selectorLabels" . | fromYaml)) }}
      {{- $_ := set $podAffinity "requiredDuringSchedulingIgnoredDuringExecution" (append $required $term) }}
      {{- $_ := set $affinity "podAffinity" $podAffinity }}
      {{- end }}
      {{- with $affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
