{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cloop-hub.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cloop-hub.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}

{{- if and .Values.executor.kubernetes.enabled .Values.executor.kubernetes.rbac.create }}
{{- $ns := include "cloop-hub.workloadNamespace" . }}
---
# The authority the hub runs workloads with, in the workload namespace only.
#
# These twelve verbs, in four rules, are not a starting point to be widened —
# they are the exact set of calls pkg/executor/kubernetes issues, enumerated
# from the call sites:
#
#   pods            create client.go createPod           — start a run
#   pods            get    client.go getPod              — poll one workload
#   pods            list   client.go listPods            — the orphan sweep
#   pods            watch  client.go watchPod            — stream phase transitions
#   pods            delete client.go deletePod           — stop, kill, and cleanup
#   pods/log        get    client.go followLogs          — stream task output
#   secrets         create client.go createSecret        — a run's credentials and environment, a fetch's token
#   secrets         patch  client.go patchSecretData     — replace a GitHub App token before its hour ends
#   secrets         delete client.go deleteSecret        — take them back
#   networkpolicies create client.go createNetworkPolicy — the Pod's egress allowlist, before the Pod
#   networkpolicies delete client.go deleteNetworkPolicy — remove it when the Pod is gone
#   networkpolicies list   client.go listNetworkPolicies — orphan sweep, and the preflight check
#
# The same table is executorRole in pkg/executor/kubernetes/rbac.go, and two
# checks hold this Role to it in both directions — nothing the driver calls
# missing, nothing it does not call granted: a Go test that renders this chart
# with `helm template` (rbac_test.go), and `kubectl auth can-i` against the
# installed release on CI's kind cluster. Widening a rule here fails both.
#
# ## The secrets rule
#
# It is create, patch and delete, and deliberately not get, list or watch. This
# driver never reads a Secret back. It writes two kinds, both owned by the run's
# Pod: one holding the brokered credential a git workspace fetch needs, which
# the init container reads through a secretKeyRef and which is deleted as soon
# as that container terminates; and the lease Secret, holding a lease's
# credential files — projected read-only — and every value of the workload's
# environment, each read into the harness through its own secretKeyRef, so no
# credential is ever a value in the Pod spec. The whole read side of the Secret
# API is authority nothing here would use, so nothing here has it — and a
# compromised hub cannot enumerate what else lives in the namespace.
#
# It also does not widen the blast radius the way it first appears to, and it
# is worth being precise about why rather than asserting it. With `pods:
# create` plus `pods/log: get` — both of which this identity already had — any
# Secret in this namespace can be read by mounting it into a Pod and printing
# it. That is not a hypothetical: it is one `kubectl run` equivalent, and it
# was true of every previous release of this chart. The namespace has always
# been the boundary; adding create and delete on Secrets does not move it. What
# would move it is a ClusterRole, or a rule in the *release* namespace where
# the hub's own credentials live — and neither exists here.
#
# What it buys is that no credential appears in a Pod spec. Without it the only
# ways to get a token or an API key to a container are an `env` value or an argv
# element, and both put the credential in an object readable by anyone with
# `get pods`, in every `kubectl describe`, and in the API server's audit log.
# With it, the Pod carries references: the workspace token lives for the length
# of one git fetch, and the lease Secret for the length of the run.
#
# ### How the Secrets get collected without a read verb
#
# They are not swept, and could not be: finding them would need `list secrets`.
# Instead each per-run Secret carries an `ownerReferences` entry naming the Pod
# that consumes it, so the cluster's own garbage collector deletes it when that
# Pod goes — whether the hub deleted it, the orphan sweep did, a node eviction
# did, or an operator did. Nothing reads a Secret back on any of those paths.
#
# This is why the rules below did not change for Task 20281. Setting an
# ownerReference on create requires no verb beyond the `create` already listed,
# and the driver deliberately leaves `blockOwnerDeletion` false: setting it true
# makes the OwnerReferencesPermissionEnforcement admission plugin require
# `update` on the owner's `pods/finalizers` subresource, which would widen this
# Role to fix a problem it does not have.
#
# ## The networkpolicies rule
#
# create, delete and list, in the networking.k8s.io group. This is what makes
# executors.kubernetes.egress_filter real: without it the driver can only label
# a Pod with its egress intent, and the Pod reaches whatever the cluster's pod
# network reaches. The driver creates one policy per Pod — selecting that Pod
# alone by its cloop.dev/handle-id label — before the Pod exists, and deletes it
# when the Pod is finished.
#
# list is here because the orphan sweep needs it, and only because of that. A
# control plane killed mid-run leaves the policy behind along with the Pod, and
# the sweep that collects orphaned Pods by label has to be able to find their
# policies by the same label. Nothing else in the driver reads a policy back.
# Since Task 20281 that sweep also runs on a timer rather than only at startup,
# which uses this same rule and adds no verb — see
# executors.orphan_sweep_interval_minutes.
#
# A NetworkPolicy gets no ownerReference, unlike the Secrets above, and the
# reason is the ordering rather than an oversight. It has to exist *before* the
# Pod, and an ownerReference needs a UID the API server only assigns when the
# Pod is created — so there is no ordering that gives it both. Attaching one
# afterwards would need `patch`, which is the same authority as widening a
# running sandbox's egress, and is refused below for exactly that reason. The
# policy does not need one: it is listable, so the sweep reaches it.
#
# There is deliberately no update or patch, here or anywhere else in this Role.
# A policy is written once, before the workload it governs starts; an identity
# that could rewrite it afterwards could widen a running sandbox's egress
# without touching the sandbox — which is precisely the authority a firewall
# must not hand out. Replacing a policy means deleting it, which means the Pod
# it selected is already gone.
#
# The rule can be omitted for a deployment that neither filters egress nor lets
# a project confine its own. Those are two conditions, not one: the driver also
# creates a policy for a project whose .cloop/sandbox.yaml sets
# capabilities.egress, on an executor with no egress_filter of its own. The same
# rule is what `cloop hub doctor --probe-network-policy` needs — deliberately,
# so that proving the cluster enforces policies never asks for authority beyond
# what enforcing them already required. `cloop executor test` reports a missing
# rule as a fatal finding rather than silently running Pods unfiltered.
#
# There is no `update` or `patch` on anything but the lease Secret: the driver
# never mutates a Pod or a NetworkPolicy after creating it, so a compromised hub
# cannot rewrite a running workload's spec or loosen the egress policy of one
# that is running. `patch` on secrets exists for one thing (Task 20375): a
# GitHub App installation token in a running Pod's lease Secret is replaced
# before GitHub's hour ends, and the kubelet syncs the Pod's directory volume
# from the patched object. It does not widen the namespace's blast radius — with
# `pods: create` any Secret here could already be read or replaced by a Pod — and
# without it a run that needs GitHub for more than an hour loses it there.
#
# `/version` is also called (preflight). It needs no rule here: Kubernetes
# grants it to system:authenticated through the built-in
# system:public-info-viewer ClusterRole.
#
# A Role and not a ClusterRole. The namespace is the blast radius, and a
# cluster-scoped grant would make "which namespace can this hub write to" a
# question with no answer.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "cloop-hub.fullname" . }}-executor
  namespace: {{ $ns }}
  labels:
    {{- include "cloop-hub.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # Write-only, by design. See the note above: no get, no list, no watch.
  # patch replaces a GitHub App token in a running Pod's lease Secret.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "patch", "delete"]
  # The per-Pod egress allowlist. list is for the orphan sweep; there is no
  # update, so a running Pod's firewall cannot be widened. See the note above.
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["create", "delete", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cloop-hub.fullname" . }}-executor
  namespace: {{ $ns }}
  labels:
    {{- include "cloop-hub.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "cloop-hub.fullname" . }}-executor
subjects:
  # The subject lives in the release namespace while the binding lives in the
  # workload namespace. That cross-namespace shape is the whole design: the
  # hub is over there, its authority is scoped to here.
  - kind: ServiceAccount
    name: {{ include "cloop-hub.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
