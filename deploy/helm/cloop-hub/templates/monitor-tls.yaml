{{- /*
The credential monitors' certificate and the CA a sandbox needs to trust it
(Task 20385).

With executor.monitorTLS.selfSigned the chart is the CA: it generates one and a
certificate for every name the monitors are advertised under, and keeps both
across upgrades by reading its own Secret back. A changed set of names — an
advertiseURL moved by hand — issues a fresh pair, because a certificate that no
longer covers the URL sandboxes dial is one every clone fails on.

Whenever the chart knows the CA (it generated it, or executor.monitorTLS.caBundle
holds it), it writes it into a ConfigMap twice: in the release namespace, where
the kube guard reads it to embed in every kubeconfig it issues, and in the
workload namespace, where the Kubernetes executor mounts it for the Pods' git
(executors.kubernetes.git_ca_bundle). A CA certificate is public material, so a
ConfigMap — which the kubelet fetches on a Pod's behalf, with no new rule in
the executor's Role — is the right object for it.
*/ -}}
{{- if include "cloop-hub.monitorsEnabled" . }}
{{- $t := include "cloop-hub.monitorTLS" . | fromJson }}
{{- $gp := include "cloop-hub.gitProxy" . | fromJson }}
{{- $caPEM := "" }}
{{- if $t.selfSigned }}
{{- $secretName := include "cloop-hub.monitorTLSSecretName" . }}
{{- $names := include "cloop-hub.monitorDNSNames" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $crt := "" }}
{{- $key := "" }}
{{- if and $existing $existing.data (eq (dig "metadata" "annotations" "cloop.dev/monitor-names" "" $existing) $names) (index $existing.data "ca.crt") }}
{{- $caPEM = index $existing.data "ca.crt" | b64dec }}
{{- $crt = index $existing.data "tls.crt" | b64dec }}
{{- $key = index $existing.data "tls.key" | b64dec }}
{{- else }}
{{- $dns := list }}
{{- $ips := list }}
{{- range splitList "," $names }}
{{- if regexMatch "^[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+$" . }}
{{- $ips = append $ips . }}
{{- else }}
{{- $dns = append $dns . }}
{{- end }}
{{- end }}
{{- $ca := genCA (printf "%s monitor CA" (include "cloop-hub.fullname" .)) 3650 }}
{{- $cert := genSignedCert (include "cloop-hub.serviceHost" .) $ips $dns 3650 $ca }}
{{- $caPEM = $ca.Cert }}
{{- $crt = $cert.Cert }}
{{- $key = $cert.Key }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cloop-hub.labels" . | nindent 4 }}
  annotations:
    # The names this certificate was issued for. A render whose names differ
    # issues a new pair rather than keep one that no longer fits.
    cloop.dev/monitor-names: {{ $names | quote }}
    # Generated by the chart. Replace with executor.monitorTLS.existingSecret
    # (cert-manager) for anything you would rotate on a schedule.
    cloop.dev/provenance: "generated by the cloop-hub chart (executor.monitorTLS.selfSigned)"
type: kubernetes.io/tls
data:
  tls.crt: {{ $crt | b64enc | quote }}
  tls.key: {{ $key | b64enc | quote }}
  ca.crt: {{ $caPEM | b64enc | quote }}
{{- else if $t.caBundle }}
{{- $caPEM = $t.caBundle }}
{{- end }}
{{- if $caPEM }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cloop-hub.monitorCAName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cloop-hub.labels" . | nindent 4 }}
data:
  # The CA that signed the monitors' certificate. The kube guard embeds it in
  # every kubeconfig it issues, so a sandbox's kubectl trusts the monitor
  # without anything installed in its image.
  ca.crt: |
    {{- $caPEM | trim | nindent 4 }}
{{- $wns := include "cloop-hub.workloadNamespace" . }}
{{- if and .Values.executor.kubernetes.enabled $gp.enabled (ne $wns .Release.Namespace) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cloop-hub.monitorCAName" . }}
  namespace: {{ $wns }}
  labels:
    {{- include "cloop-hub.labels" . | nindent 4 }}
data:
  # Mounted read-only into every workload Pod at /etc/cloop/git-ca/ca.crt and
  # trusted by its git for the git proxy's URL only — every other host keeps
  # the image's own store.
  ca.crt: |
    {{- $caPEM | trim | nindent 4 }}
{{- end }}
{{- end }}
{{- end }}
