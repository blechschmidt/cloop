{{- $gp := include "cloop-hub.gitProxy" . | fromJson }}
{{- $kg := include "cloop-hub.kubeGuard" . | fromJson }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cloop-hub.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cloop-hub.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    {{- if $gp.enabled }}
    # The git interception proxy, which sandboxes' git dials directly: it is
    # not behind the Ingress, and it terminates its own TLS.
    - port: {{ $gp.port }}
      targetPort: git-proxy
      protocol: TCP
      name: git-proxy
    {{- end }}
    {{- if $kg.enabled }}
    - port: {{ $kg.port }}
      targetPort: kube-guard
      protocol: TCP
      name: kube-guard
    {{- end }}
  selector:
    {{- include "cloop-hub.selectorLabels" . | nindent 4 }}
