apiVersion: v1
kind: Service
metadata:
  name: {{ include "cloop-hub.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cloop-hub.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    {{- if .Values.executor.gitProxy.enabled }}
    # The git interception proxy, which sandboxes' git dials directly: it is
    # not behind the Ingress, and it terminates its own TLS.
    - port: {{ .Values.executor.gitProxy.port }}
      targetPort: git-proxy
      protocol: TCP
      name: git-proxy
    {{- end }}
    {{- if .Values.executor.kubeGuard.enabled }}
    - port: {{ .Values.executor.kubeGuard.port }}
      targetPort: kube-guard
      protocol: TCP
      name: kube-guard
    {{- end }}
  selector:
    {{- include "cloop-hub.selectorLabels" . | nindent 4 }}
