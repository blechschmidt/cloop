{{- include "cloop-hub.validate" . -}}
{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cloop-hub.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cloop-hub.labels" . | nindent 4 }}
  annotations:
    # Not a warning about the Secret resource — a warning about where these
    # values came from. Everything below was passed through Helm values, so it
    # is in the release's stored manifest, in `helm get manifest`, and in
    # whatever file or CI log carried the --set. For anything you would mind
    # leaking, use secrets.existingSecret.
    cloop.dev/provenance: "rendered from Helm values — evaluation only"
type: Opaque
# data, not stringData. The API server keeps stringData only as data, so a key
# dropped from stringData stays in the Secret through every upgrade — Helm's
# merge compares against the manifest it rendered last, which never had a data
# entry to remove. For CLOOP_SECRET_KEY_PREVIOUS that would leave the old root
# key with every replica after a change of root had finished (Task 20425).
data:
  CLOOP_SECRET_KEY: {{ .Values.secrets.secretKey | toString | b64enc | quote }}
  {{- with .Values.secrets.previousSecretKey }}
  CLOOP_SECRET_KEY_PREVIOUS: {{ . | toString | b64enc | quote }}
  {{- end }}
  {{- with .Values.secrets.uiToken }}
  CLOOP_UI_TOKEN: {{ . | toString | b64enc | quote }}
  {{- end }}
  {{- with .Values.secrets.oidcClientSecret }}
  CLOOP_OIDC_CLIENT_SECRET: {{ . | toString | b64enc | quote }}
  {{- end }}
{{- end }}
