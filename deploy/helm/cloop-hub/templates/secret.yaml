{{- include "cloop-hub.validate" . -}}
{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cloop-hub.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cloop-hub.labels" . | nindent 4 }}
  annotations:
    # Not a warning about the Secret resource — a warning about where these
    # values came from. Everything below was passed through Helm values, so it
    # is in the release's stored manifest, in `helm get manifest`, and in
    # whatever file or CI log carried the --set. For anything you would mind
    # leaking, use secrets.existingSecret.
    cloop.dev/provenance: "rendered from Helm values — evaluation only"
type: Opaque
stringData:
  CLOOP_SECRET_KEY: {{ .Values.secrets.secretKey | quote }}
  {{- with .Values.secrets.uiToken }}
  CLOOP_UI_TOKEN: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.oidcClientSecret }}
  CLOOP_OIDC_CLIENT_SECRET: {{ . | quote }}
  {{- end }}
{{- end }}
