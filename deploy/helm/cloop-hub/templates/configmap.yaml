{{- /*
Refuse to render a hub that cannot run anything.

With allowHostProcess false and no isolating executor configured, the hub comes
up correctly refusing every run, and /readyz reports not-ready — so the
Deployment never reaches Available and `helm install` hangs until it times out
with nothing useful said. Failing here turns that into a message naming the two
values that resolve it.

Enrolled remote agents are the third way to satisfy this, but a fresh install
has none, so requiring one of the two in-cluster backends is right for a first
render. Set config.allowIsolationlessInstall to skip this when adopting an
existing hub whose fleet is edge devices.
*/ -}}
{{- if and (not .Values.config.allowHostProcess) (not .Values.executor.kubernetes.enabled) (not .Values.config.allowIsolationlessInstall) }}
{{- fail "cloop-hub: config.allowHostProcess is false but no isolating executor is enabled, so this hub could not run any workload and would never pass its readiness probe.\n\nPick one:\n  --set executor.kubernetes.enabled=true    schedule runs as ephemeral Pods (recommended; the chart installs the Role)\n  --set config.allowHostProcess=true        run harnesses in the hub Pod itself (no isolation boundary)\n  --set config.allowIsolationlessInstall=true   you will enroll remote agents; the hub starts not-ready until one does" }}
{{- end }}
{{- if .Values.config.fromConfigMap }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cloop-hub.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cloop-hub.labels" . | nindent 4 }}
data:
  # Mounted read-only at /var/lib/cloop/.cloop/config.yaml. The hub cannot
  # rewrite its own execution policy from inside the Pod, which is the point
  # of rendering it here rather than letting the dashboard own it.
  #
  # No secret appears in this file. The OIDC client secret, the broker master
  # key and the dashboard token all arrive as environment variables from a
  # Secret — see templates/deployment.yaml.
  config.yaml: |
    # Generated by the cloop-hub Helm chart. Edit values.yaml, not this.

    executors:
      # false: no run can fork a harness on the hub Pod. With the container
      # image being distroless there is nothing to fork anyway, but the policy
      # is what makes the API refuse rather than the filesystem.
      allow_host_process: {{ .Values.config.allowHostProcess }}
    {{- if .Values.executor.kubernetes.enabled }}
      kubernetes:
        enabled: true
        # Authenticate as this Pod's own ServiceAccount rather than leasing a
        # kubeconfig from the broker. The authority is the Role installed by
        # this chart, enforced by the API server.
        in_cluster: true
        namespace: {{ include "cloop-hub.workloadNamespace" . | quote }}
        image: {{ default (include "cloop-hub.image" .) .Values.executor.kubernetes.image | quote }}
        image_pull_policy: {{ .Values.image.pullPolicy | quote }}
        {{- with .Values.executor.kubernetes.imagePullSecrets }}
        # Resolved in the WORKLOAD namespace, not this one. ImagePullSecrets
        # are namespaced, so image.pullSecrets (which pulls the hub's own
        # image, here) is the wrong list — reusing it names Secrets that do
        # not exist where the workload Pods are created.
        image_pull_secrets: {{ toJson . }}
        {{- end }}
        cpu_request: {{ .Values.executor.kubernetes.cpuRequest | quote }}
        cpu_limit: {{ .Values.executor.kubernetes.cpuLimit | quote }}
        memory_request: {{ .Values.executor.kubernetes.memoryRequest | quote }}
        memory_limit: {{ .Values.executor.kubernetes.memoryLimit | quote }}
        ephemeral_storage_limit: {{ .Values.executor.kubernetes.ephemeralStorageLimit | quote }}
        active_deadline_seconds: {{ .Values.executor.kubernetes.activeDeadlineSeconds }}
        max_concurrent: {{ .Values.executor.kubernetes.maxConcurrent }}
    {{- end }}

    ui:
      external_url: {{ .Values.config.externalURL | quote }}
      # A WebSocket is exempt from the same-origin policy. Pinned to the one
      # origin the hub is actually served from.
      allowed_ws_origins:
        - {{ .Values.config.externalURL | quote }}
      # TLS terminates at the Ingress, so the hub speaks plain HTTP inside the
      # cluster. The Ingress MUST set X-Forwarded-Proto: https — that header
      # is what marks the session cookie Secure.
      tls: {}
      max_websocket_conns: 256
      max_websocket_conns_per_ip: 16
      max_request_body_bytes: 10485760
      oidc:
        enabled: {{ .Values.oidc.enabled }}
        {{- if .Values.oidc.enabled }}
        issuer: {{ required "oidc.issuer is required when oidc.enabled is true" .Values.oidc.issuer | quote }}
        client_id: {{ .Values.oidc.clientID | quote }}
        # client_secret arrives as CLOOP_OIDC_CLIENT_SECRET from the Secret.
        redirect_url: {{ printf "%s/auth/callback" (trimSuffix "/" .Values.config.externalURL) | quote }}
        {{- end }}
        scopes: {{ toJson .Values.oidc.scopes }}
        # Deny-by-default: authenticating is not authorization.
        default_role: {{ .Values.oidc.defaultRole | quote }}
        {{- with .Values.oidc.adminEmails }}
        admin_emails: {{ toJson . }}
        {{- end }}
        role_mappings: {{ toJson .Values.oidc.roleMappings }}
        session_ttl_hours: {{ .Values.oidc.sessionTTLHours }}
        cookie_secure: always

    rate_limit:
      requests_per_second: 20
      burst: 50
    {{- with .Values.config.extra }}

    # values.config.extra
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
