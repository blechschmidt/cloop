# Default values for cloop-hub.
#
# The defaults here are the hardened ones. Where a setting exists only because
# some cluster needs an escape hatch, the comment says which cluster and what
# you give up — a value you can flip without knowing the cost is a value that
# gets flipped.

image:
  repository: ghcr.io/blechschmidt/cloop
  # Pin by digest in production. A floating tag means the thing that runs your
  # agents can change without a deploy, which is a supply-chain decision made
  # by whoever last pushed to the registry.
  tag: ""            # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent
  # Pulls the *hub's* image, so these are Secrets in the release namespace.
  # Standard Kubernetes form — a list of {name: …}, not bare strings.
  # Workload Pods live in another namespace and need their own list; see
  # executor.kubernetes.imagePullSecrets.
  pullSecrets: []
  #  - name: ghcr-auth

nameOverride: ""
fullnameOverride: ""

# Hub processes serving this release. Every replica is a member of one hub
# cluster (docs/architecture/hub-cluster.md): the Service may send any request
# to any replica, a member forwards what only another can answer — a Stop for a
# run another member streams, a login callback for a login another began — and
# when a replica goes away, crashed or replaced by an upgrade, the others pick
# up its runs, agents and sessions. `cloop hub cluster status` in any Pod shows
# the members, the leader and who owns what.
#
# What replicas buy: upgrades and Pod restarts without downtime, and request,
# WebSocket and agent connections spread over several processes. What they do
# not buy is a second node. The control plane is one SQLite database, and
# SQLite's write-ahead log needs every process using it on one kernel, so the
# chart pins the replicas to the node the volume is attached to (a required
# podAffinity term, added to whatever `affinity` sets) and refuses to render
# them without persistence — Pods on their own emptyDirs would be separate
# hubs. For capacity to run more work, move the work to executors
# (executor.kubernetes.enabled): those scale out across the cluster.
#
# With more than one replica the Deployment rolls: a replacement joins before a
# member leaves, and a leaving member hands its runs over on SIGTERM. With one
# it recreates, unless strategy.type is RollingUpdate — see `strategy` below.
replicaCount: 1

# The Deployment's update strategy. Empty derives it from replicaCount:
# Recreate for one replica, RollingUpdate (maxSurge 1, maxUnavailable 0) for
# more. Set type: RollingUpdate with one replica for upgrades without downtime;
# the chart then pins the surge Pod to the node holding the volume too.
strategy: {}

# ── HTTP ────────────────────────────────────────────────────────────────────
service:
  type: ClusterIP
  port: 8080
  annotations: {}

ingress:
  enabled: false
  # Empty means "use the cluster's default IngressClass". Check that one
  # exists: ingress-nginx v1+ ignores class-less Ingresses unless it was
  # started with --watch-ingress-without-class, and the failure is silent —
  # the object is created, `helm install --wait` succeeds, and the hub is
  # simply unreachable.
  #   kubectl get ingressclass
  className: ""
  # The hub must be reachable at exactly this host: it is what ui.external_url
  # and the OIDC redirect are built from, and a mismatch presents as a login
  # that loops back to the sign-in page.
  host: cloop.example.com
  path: /
  pathType: Prefix
  annotations:
    # cloop is WebSocket-first. Without a long read timeout the dashboard
    # loads and then silently stops updating, which reads as a cloop bug.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # Match ui.max_request_body_bytes. ingress-nginx defaults to 1m, so
    # without this a request between 1 and 10 MiB is rejected by the proxy
    # with a 413 the hub never sees and never records.
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  tls:
    enabled: true
    # Empty derives <fullname>-tls, so two releases in one namespace do not
    # collide on the same Secret.
    secretName: ""

# ── Configuration ───────────────────────────────────────────────────────────
config:
  # Render .cloop/config.yaml from this chart into a ConfigMap and mount it
  # read-only. This is the GitOps path: the hub's execution policy lives in
  # your values file and cannot be edited from inside the running Pod.
  #
  # Setting this false does NOT mean "same hub, editable config". It means
  # the hub starts with no config file at all, so every value below —
  # allowHostProcess, externalURL, allowed_ws_origins, the whole oidc block —
  # simply does not reach it, and cloop's own permissive defaults apply:
  # host execution ALLOWED, no origin pinning, no SSO. The chart refuses the
  # oidc.enabled combination outright for that reason, and NOTES.txt says so
  # for the rest.
  #
  # Use it only if you intend to write a config into the hub's volume
  # yourself. The trade-off it is usually reached for — the dashboard's
  # config-write actions failing against a read-only mount — is not worth
  # this.
  fromConfigMap: true

  # The URL browsers use. Must match the Ingress host and the redirect
  # registered at your identity provider.
  externalURL: https://cloop.example.com

  # false means no run can ever fork a harness on the hub Pod. Leave it.
  # The hub becomes useful by having an executor (below), not by being
  # allowed to execute.
  #
  # Because that is true, the chart REFUSES to render when this is false and
  # executor.kubernetes.enabled is also false: such a hub refuses every run
  # and its /readyz never goes green, so the install would hang at 0/1
  # Available rather than fail with a reason. Enable the Kubernetes executor,
  # or set the escape hatch below.
  allowHostProcess: false

  # Skip that check. For adopting a hub whose fleet is enrolled remote agents:
  # it starts not-ready — correctly, it has nothing to dispatch to — and
  # becomes ready when the first agent connects. Raise
  # readinessProbe.failureThreshold if agents dial in slowly.
  allowIsolationlessInstall: false

  # Verbatim extra YAML merged into the generated config.yaml at the top
  # level. For settings the chart does not model — budgets, webhooks,
  # provider tuning.
  extra: {}

# ── Image trust ─────────────────────────────────────────────────────────────
# Which container images a *project* may name in its own .cloop/sandbox.yaml.
#
# That file arrives by `git pull`: anyone who can open a pull request can
# propose one, and the image it names is not data the sandbox processes — it IS
# the sandbox. Its entrypoint, its libraries and its PATH are the environment
# the harness runs in, and the credentials the hub injects at start are handed
# straight to it. Without a policy here, "the hub never runs untrusted code on
# the host" is true and beside the point, because the code inside the container
# was chosen by the same pull request.
#
# The defaults are deliberately restrictive. A project that needs a different
# toolchain publishes its image to the registry this deployment already trusts,
# or the operator widens allowedRegistries on purpose.
sandbox:
  imagePolicy:
    # Registry hosts a project may pull from. Empty derives the registry of
    # image.repository above — the one registry this deployment has already
    # decided to trust.
    #
    # Matching is on the parsed reference, so "ghcr.io" here does not admit
    # "ghcr.io.attacker.example/x" or "attacker.example/ghcr.io/x". Two other
    # forms are accepted: "*.example.com" (subdomains, at a label boundary)
    # and "*" (any registry — only meaningful alongside requireDigest).
    allowedRegistries: []
    #  - ghcr.io
    #  - registry.internal:5000

    # Narrow further to particular repositories. Empty means any repository on
    # an allowed registry. A trailing "/*" matches at a path-component
    # boundary, so "ghcr.io/acme/*" does not match "ghcr.io/acme-evil/x".
    allowedRepos: []
    #  - ghcr.io/acme/*

    # Refuse an image pinned only to a tag.
    #
    # On by default, and it matters most here: a tag in a Pod spec is resolved
    # by a kubelet, on a node, whenever it schedules — the control plane has no
    # cluster image store to resolve it against first. So on Kubernetes an
    # unpinned reference means the artifact that runs is whatever the tag
    # pointed at by then, which may not be what anything evaluated.
    requireDigest: true

    # Refuse an image whose signature cosign cannot verify.
    #
    # Off by default because it needs the cosign binary in the hub image and
    # keys or identities below. When it is on and cosign is missing, the hub
    # refuses every project image rather than admitting them unchecked — that
    # is the intended behaviour, and it is why this is opt-in.
    requireSignature: false

    # Paths (inside the hub Pod) to cosign public keys. Any one may carry the
    # signature; listing two describes a rotation, not a quorum.
    cosignPublicKeys: []
    #  - /etc/cloop/cosign/acme.pub

    # Keyless identities. subjectRegexp is required — an issuer on its own
    # would trust every workflow at that provider, including one in a
    # repository you have never heard of.
    cosignIdentities: []
    #  - issuer: https://token.actions.githubusercontent.com
    #    subjectRegexp: ^https://github\.com/acme/.+

    # Qualify a reference that names no registry. Unset, "alpine:3" is refused
    # rather than assumed to be Docker Hub: which registry an unqualified name
    # resolves to is the executor host's configuration (podman consults
    # unqualified-search-registries), so the same reference can legitimately
    # pull from different places on two nodes in one fleet.
    defaultRegistry: ""

oidc:
  enabled: false
  issuer: ""                       # https://idp.example.com/realms/main
  clientID: cloop-hub
  # clientSecret is NOT set here. It comes from the Secret referenced under
  # .secrets — putting it in values.yaml puts it in your git history and in
  # `helm get values` for anyone who can read the release.
  scopes: [openid, profile, email, groups]
  adminEmails: []
  # Deny-by-default: an authenticated user matching no binding gets nothing.
  # "viewer" would put your entire directory inside the hub the moment SSO is
  # switched on.
  defaultRole: none
  roleMappings: []
  #  - {claim: group, value: platform-admins, role: admin}
  #  - {claim: group, value: engineering,     role: operator}
  sessionTTLHours: 12

  # Refuse to start when the issuer cannot be resolved, rather than warning and
  # retrying at the first sign-in.
  #
  # True by default here and false in cloop's own default, because the failure
  # modes differ. A pod that exits is rolled back by the deployment, so a
  # misspelled issuer or an unregistered client never replaces a working hub.
  # Without it the hub starts, stays out of its Service on the readiness gate,
  # and an operator has to go looking for why — the same outcome, told less
  # clearly.
  #
  # Set false if your identity provider runs in this cluster and may come up
  # after the hub: with it on, the hub backs off and restarts until the
  # provider answers, which is correct but noisy.
  requireIdP: true

# ── Secrets ─────────────────────────────────────────────────────────────────
secrets:
  # Reference a Secret you created out-of-band. This is the production path:
  #
  #   kubectl create secret generic cloop-hub-secrets \
  #     --from-literal=CLOOP_SECRET_KEY="$(head -c32 /dev/urandom | base64 | tr -d =)" \
  #     --from-literal=CLOOP_UI_TOKEN="$(head -c32 /dev/urandom | base64 | tr -d =)" \
  #     --from-literal=CLOOP_OIDC_CLIENT_SECRET=…
  #
  # CLOOP_SECRET_KEY is the master passphrase for the secret broker: every
  # key-encryption key is derived from it, and those keys seal the data keys
  # that seal each brokered kubeconfig, PAT and egress credential. Losing it
  # makes them permanently unopenable — there is no escrow. Back it up wherever
  # you keep root credentials, and never let Helm generate it for a cluster you
  # care about.
  #
  # Rolling the sealing keys does NOT require changing this value: run
  # "cloop hub key rotate" against the hub. It rewraps every data key onto a
  # fresh key-encryption key while the hub keeps serving, and re-mints nothing.
  existingSecret: ""

  # Chart-managed Secret. For evaluation only: the values land in your
  # values file, in the release's stored manifest and in `helm get manifest`.
  create: false
  secretKey: ""              # CLOOP_SECRET_KEY
  uiToken: ""                # CLOOP_UI_TOKEN
  oidcClientSecret: ""       # CLOOP_OIDC_CLIENT_SECRET

  # Additional environment variables from other Secrets — provider API keys
  # in particular (ANTHROPIC_API_KEY, OPENAI_API_KEY).
  extraEnvFrom: []
  #  - secretRef:
  #      name: cloop-provider-keys

# ── Storage ─────────────────────────────────────────────────────────────────
persistence:
  enabled: true
  # Mounted at /var/lib/cloop/.cloop — the state directory itself, not its
  # parent. That keeps the image-provided parent read-only while the SQLite
  # database, artifacts and the project registry all land on the volume.
  size: 10Gi
  storageClass: ""
  # ReadWriteOnce is not a limitation to work around. SQLite needs every
  # process writing to it on one kernel — over a filesystem shared between
  # nodes, two writers corrupt it — and ReadWriteOnce is exactly "one node".
  # Replicas share the volume by being pinned to that node (see replicaCount).
  # Not ReadWriteOncePod, which would admit only one of them.
  accessMode: ReadWriteOnce
  existingClaim: ""

# ── In-cluster executor ─────────────────────────────────────────────────────
# When enabled, the hub schedules each run as an ephemeral Pod and
# authenticates as its own ServiceAccount rather than a brokered kubeconfig.
# The chart installs a Role granting exactly the verbs
# pkg/executor/kubernetes/pod.go issues — nothing wider.
executor:
  kubernetes:
    enabled: false

    # Where workload Pods are created. Default is a namespace *other* than
    # the hub's, and that is the point: a workload in the hub's namespace can
    # see the hub's Secrets and its ServiceAccount token, which defeats the
    # isolation the executor exists to provide.
    #
    # The namespace must already exist and the RoleBinding below is created
    # in it, so the installing principal needs RBAC write access there.
    namespace: cloop-workloads

    # Harness image. Must contain the cloop binary — there is no bind-mounted
    # host binary to fall back on in a cluster.
    #
    # Empty falls back to the hub image, which is enough to prove the executor
    # works (`cloop executor test kubernetes` runs `cloop version` in a Pod)
    # and is NOT enough to run a real task. The hub image is distroless: no
    # shell, no git, no language toolchains, no coding agent. A harness that
    # has to clone a repository and run a build needs an image you built for
    # that, with cloop on PATH.
    image: ""

    # Secrets in the WORKLOAD namespace holding registry auth for the image
    # above. Separate from image.pullSecrets because imagePullSecrets are
    # namespaced and the two namespaces differ. Bare strings here, which is
    # what cloop's config schema takes.
    imagePullSecrets: []
    #  - ghcr-auth

    # Bound every workload. Without limits a run is constrained only by the
    # namespace's LimitRange, if one exists.
    cpuRequest: 250m
    cpuLimit: "2"
    memoryRequest: 512Mi
    memoryLimit: 4Gi
    ephemeralStorageLimit: 8Gi

    # Wall-clock ceiling enforced by the kubelet rather than by cloop, so it
    # survives a control-plane restart. 0 disables it.
    activeDeadlineSeconds: 7200

    # 0 is unbounded. Set it to whatever your namespace quota can absorb.
    maxConcurrent: 0

    # Enforce an egress allowlist with a NetworkPolicy per workload Pod.
    #
    # Off by default, and the default is deliberate twice over: enabling it on
    # an upgrade would firewall workloads nobody asked to firewall, and an empty
    # allowlist denies everything — including whatever your harness clones from.
    # Turning it on is a decision about what the sandbox may reach, so it wants
    # cidrs/ports or allowPublicInternet set alongside it.
    #
    # It is enforced by the cluster's CNI, not by cloop. flannel does not
    # implement NetworkPolicy; Calico, Cilium, Antrea and most managed CNIs do.
    # `cloop executor test kubernetes` warns about this, because which CNI is
    # running is a fact about your cluster that cloop cannot read from the API.
    egressFilter:
      enabled: false

      # Destination ranges the sandbox may reach. These are also the only thing
      # that waives the hard-block set (RFC1918, link-local, CGNAT, multicast,
      # 169.254.169.254): naming a private range explicitly buys that range and
      # nothing else. A /0 is refused — use allowPublicInternet.
      cidrs: []
      #  - 10.8.0.0/24

      # Destination ports every allow above is bounded by. Naming destinations
      # without ports is a config error here, not a wildcard.
      ports: []
      #  - 443

      # Open every address outside the block set, on the ports above. This is
      # what a hostname allowlist becomes at layer 3, because hostnames do not
      # exist there — set it knowing that "*.github.com" means "the Internet".
      allowPublicInternet: false

      # DNS servers the sandbox may query directly ("10.96.0.10", or with a
      # port). Only needed when the workload does not use cluster DNS.
      resolvers: []

      # UDP and TCP 53 to kube-system. Leave this on: without it a default-deny
      # egress policy breaks name resolution, and the failure reads as "the
      # network is broken" rather than "DNS is denied".
      allowClusterDNS: true

    # Install the ServiceAccount, Role and RoleBinding. Turn this off only if
    # your platform manages RBAC separately — the executor still needs the
    # same verbs, granted by someone.
    rbac:
      create: true

  # ── Credential monitors ───────────────────────────────────────────────────
  # Two listeners in the hub process that hold a credential so the sandbox
  # does not (docs/architecture/git-proxy.md, kubernetes-access.md). Each is a
  # second port on the hub Pod and on its Service, served over TLS — the
  # session token a sandbox presents rides every request.
  #
  # Both are off by default: turning one on changes the URL a sandbox's git or
  # kubectl talks to, which is an operator's decision rather than something an
  # upgrade should do. Both need monitorTLS below.

  # The git interception proxy. With it on, a GitHub token granted to a
  # project stays in the hub: the workload's git gets a session token worth
  # nothing anywhere else, and the branch allowlist is enforced on the push
  # itself by a process the sandbox does not control.
  gitProxy:
    enabled: false
    # The port the proxy listens on in the hub Pod, and the Service port that
    # exposes it. Not the dashboard's 8080.
    port: 8443
    # What a workload's git is pointed at. Empty derives the in-cluster
    # Service name, https://<fullname>.<namespace>.svc:<port>, which is right
    # for the Kubernetes executor. Set it for edge devices outside the
    # cluster — to a name they resolve, routed to this port — and make sure
    # the certificate covers it. Must be https://, with no path: the chart
    # refuses anything else.
    advertiseURL: ""
    # How long one session lives: the window covering a run's clone and its
    # last push. 0 means 60; at most 720.
    sessionMinutes: 0
    # Ref globs a sandbox may push. Empty means refs/heads/cloop/** — the
    # write-back namespace. Widening this is how a hub stops protecting the
    # branches a human owns; a grant can only narrow it.
    allowedRefs: []
    # Let a sandbox delete refs it may otherwise write. A write-back never
    # deletes.
    allowDelete: false

  # The Kubernetes access monitor ("kube guard"). With it on, a kubeconfig
  # granted to a project stays in the hub: the workload's kubectl gets a
  # kubeconfig naming this monitor and a session token, and the grant's verbs
  # and namespaces are enforced outside the sandbox. A grant with no verbs is
  # read-only.
  kubeGuard:
    enabled: false
    port: 8444
    # As gitProxy.advertiseURL: empty derives
    # https://<fullname>.<namespace>.svc:<port>.
    advertiseURL: ""
    sessionMinutes: 0
    # A hub-wide ceiling on what any grant may allow. Empty means each grant
    # decides; listing the read verbs here means no project on this hub can
    # ever write to a cluster, whatever a grant asks for.
    verbs: []
    namespaces: []
    resources: []
    # Record every forwarded request in the audit trail, not only the
    # refused ones. Off by default: one `kubectl get pods` is a burst of
    # discovery requests and a watch never ends, so the rows bury denials.
    auditAllowed: false

  # TLS for both monitors: one certificate, whose names cover both advertise
  # URLs (they differ only in port). Exactly one source when a monitor is on.
  monitorTLS:
    # A kubernetes.io/tls Secret in the release namespace — tls.crt and
    # tls.key for <fullname>.<namespace>.svc (and any advertiseURL host).
    # cert-manager writes exactly this shape. The production path.
    existingSecret: ""
    # Or let the chart generate a CA and a certificate for the Service's
    # names. Kept across `helm upgrade` by reading the Secret back, so it is
    # for installs Helm manages directly: a tool that renders without cluster
    # access (Argo CD, `helm template`) gets a new CA on every render.
    selfSigned: false

    # How workload Pods come to trust the certificate. The CA has to reach the
    # *sandbox's* git, not the hub's. With selfSigned the chart delivers its
    # own CA and none of these is needed; with existingSecret pick one:
    #
    #   caBundle             the CA as PEM; the chart writes it into a
    #                        ConfigMap in the workload namespace (and the hub
    #                        embeds it in the kubeconfigs the monitor issues)
    #   workloadCAConfigMap  a ConfigMap you maintain in the workload
    #                        namespace — what trust-manager produces
    #   publiclyTrusted      the certificate chains to a CA the workload image
    #                        already trusts; deliver nothing
    #
    # Whichever it is, git trusts it for the proxy's URL only: every other
    # host keeps the image's own store (executors.kubernetes.git_ca_bundle).
    caBundle: ""
    workloadCAConfigMap: ""
    workloadCAKey: ca.crt
    publiclyTrusted: false

# CAs the hub itself trusts for outbound TLS, added to the image's own bundle
# rather than replacing it (SSL_CERT_DIR): a forge behind a private CA that the
# git proxy forwards to, an identity provider likewise. A ConfigMap in the
# release namespace; every key in it is read as PEM.
extraCACerts:
  configMap: ""

# Standard Pod hostAliases for the hub — /etc/hosts entries. For a forge or an
# identity provider reachable by an address its DNS name does not resolve to
# from inside the cluster.
hostAliases: []
#  - ip: 10.96.0.20
#    hostnames: [git.internal.example]

serviceAccount:
  create: true
  name: ""
  annotations: {}
  # The whole in-cluster mode depends on this token existing.
  automountServiceAccountToken: true

# ── Pod security ────────────────────────────────────────────────────────────
# These satisfy the "restricted" Pod Security Standard. They are defaults
# rather than hard-coded so an unusual cluster can adjust — but every one of
# them is load-bearing, and the image is built to need none of what they
# remove.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  # Makes the PVC group-writable by the Pod's group. Without it the hub gets
  # a root-owned volume and fails on the first database write.
  fsGroup: 65532
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 2Gi

# Liveness asks "is this process alive" and nothing else, so a slow database
# never triggers a restart. Readiness pings SQLite, so a hub with unavailable
# storage leaves the Service's endpoints instead of serving errors.
livenessProbe:
  httpGet: {path: /healthz, port: http}
  initialDelaySeconds: 5
  periodSeconds: 20
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet: {path: /readyz, port: http}
  initialDelaySeconds: 3
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

startupProbe:
  httpGet: {path: /healthz, port: http}
  periodSeconds: 3
  failureThreshold: 40

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
priorityClassName: ""
terminationGracePeriodSeconds: 30

extraEnv: []
#  - name: ANTHROPIC_BASE_URL
#    value: https://gateway.internal/anthropic
