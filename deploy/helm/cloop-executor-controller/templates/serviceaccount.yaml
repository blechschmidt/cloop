{{- if .Values.serviceAccount.create }}
# The controller's identity, and the subject of the Role below. Its token is
# mounted only into the controller's own Pods, which ask for it in their spec:
# the account itself says false, so no other Pod that names it — by mistake,
# or a runner whose pool names it, which the controller refuses anyway — gets
# its token by default.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cloop-executor-controller.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cloop-executor-controller.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- include "cloop-executor-controller.stringMap" . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
{{- if .Values.runnerServiceAccount.create }}
---
# The account runner Pods run as. Bound to no Role: a runner needs no
# Kubernetes API to take a run. Its token is never mounted by default — the
# account says false, and the controller states the Pod's own setting on
# every runner, true only for a pool that sets
# template.automountServiceAccountToken.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cloop-executor-controller.runnerServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cloop-executor-controller.labels" . | nindent 4 }}
  {{- with .Values.runnerServiceAccount.annotations }}
  annotations:
    {{- include "cloop-executor-controller.stringMap" . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
