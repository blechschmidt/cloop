{{- with .Values.pool.credential.value }}
# The pool's controller credential, written from pool.credential.value. For
# evaluation: the value is in your values file and in the release's stored
# manifest. In production create the Secret yourself and name it in
# pool.credential.existingSecret.
#
# The controller reads it by name and presents it to the hub; no runner is
# ever given it — the ExecutorPool refuses a template variable that reads it.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cloop-executor-controller.credentialSecretName" $ }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "cloop-executor-controller.labels" $ | nindent 4 }}
type: Opaque
data:
  credential: {{ trim (toString .) | b64enc | quote }}
{{- end }}
